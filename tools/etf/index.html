<script>
// ===== STATE =====
let DATA = {};
let NAMES = [];
let HOLDINGS = {};
let DATES = [];        // 저장된 영업일 목록 (오름차순)
let COMPS = {};        // {1:{date,w,codes}, 5:{...}, 10:{...}} — N영업일 전 비중 비교용
let RET = null;        // ETF 수익률 랭킹 {top5:[[code,r]], top20:[], d0,d5,d20} (db/market/price 기반)
let ETFS_CUR = {};     // 현재 날짜의 etfCode -> etfName
let stockSort = 'w';   // 종목 검색 정렬: 'w'|'d1'|'d5'|'d10'
let currentDate = null;
let currentView = null;
let acIndex = -1;
let acFiltered = [];
let selectedStocks = [];

// ===== DOM =====
const dateSelect = document.getElementById('dateSelect');
const dateInfo = document.getElementById('dateInfo');
const searchInput = document.getElementById('searchInput');
const autocompleteEl = document.getElementById('autocomplete');
const statsArea = document.getElementById('statsArea');
const resultArea = document.getElementById('resultArea');
const introArea = document.getElementById('introArea');
const tbody = document.getElementById('tbody');
const thead = document.getElementById('thead');
const breadcrumb = document.getElementById('breadcrumb');
const backBtnArea = document.getElementById('backBtnArea');
const tagsArea = document.getElementById('tagsArea');
let viewHistory = [];

// ===== INIT =====
async function init() {
  try {
    const resp = await fetch('data/dates.json');
    const dates = await resp.json();

    DATES = dates;
    dateSelect.innerHTML = dates.map(d =>
      '<option value="' + d + '">' + d + '</option>'
    ).join('');
    dateSelect.disabled = false;

    // Auto-select latest date
    dateSelect.value = dates[dates.length - 1];
    await loadDateData(dates[dates.length - 1]);
  } catch (err) {
    introArea.innerHTML = '<div class="intro"><div class="emoji">&#9888;&#65039;</div>' +
      '<p>데이터를 불러올 수 없습니다.<br>data/ 폴더에 dates.json 파일이 있는지 확인해주세요.</p></div>';
  }
}

// ===== Load date data =====
// 날짜 하나의 데이터를 로드 (db/etf/*.parquet를 hyparquet로 직접 읽음)
async function fetchDateMap(date) {
  const buf = await (await fetch('/db/etf/' + date + '.parquet')).arrayBuffer();
  const rows = await hyparquet.parquetReadObjects({ file: buf });
  const etfs = {}, holdings = {};
  for (const r of rows) {
    etfs[r.etf_code] = r.etf_name;
    (holdings[r.etf_code] || (holdings[r.etf_code] = []))
      .push([r.stock_name, r.weight == null ? null : Math.round(r.weight * 1000) / 1000]);
  }
  return { etfs: etfs, holdings: holdings };
}

// N영업일 전 대비 비중 변화(%p). ETF가 비교일에 없으면 null, 미보유였으면 +현재비중(신규 편입)
function deltaFor(code, stock, curW, off) {
  const c = COMPS[off];
  if (!c || curW == null || !c.codes.has(code)) return null;
  return curW - (c.w.get(code + '|' + stock) || 0);
}

// 레버리지 ETF(인버스2X 포함)는 수익률·편입 비중 랭킹에서 제외
const LEV = /레버리지|인버스\s*2X|곱버스/i;

// ===== ETF 수익률 (db/market/price 월별 수정주가) =====
// 기준일 포함 최근 3개월 파일을 읽어 5·20영업일 수익률 랭킹을 계산
async function loadPrices(date, etfMap) {
  const etfCodes = new Set(Object.keys(etfMap).filter(c => !LEV.test(etfMap[c] || '')));
  const months = [];
  const [y, m] = [parseInt(date.slice(0, 4)), parseInt(date.slice(5, 7))];
  for (let k = 2; k >= 0; k--) {
    const mm = m - k, yy = y + Math.floor((mm - 1) / 12), mo = ((mm - 1) % 12 + 12) % 12 + 1;
    months.push(yy + '-' + String(mo).padStart(2, '0'));
  }
  const chunks = await Promise.all(months.map(async mo => {
    try {
      const resp = await fetch('/db/market/price/' + mo + '.parquet');
      if (!resp.ok) return [];
      return await hyparquet.parquetReadObjects({ file: await resp.arrayBuffer() });
    } catch (e) { return []; }
  }));

  const dateSet = new Set();
  const pm = new Map();   // code -> Map(dateStr -> close)
  for (const rows of chunks) {
    for (const r of rows) {
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d > date) continue;
      dateSet.add(d);
      if (!etfCodes.has(r.code)) continue;
      let m2 = pm.get(r.code);
      if (!m2) pm.set(r.code, m2 = new Map());
      m2.set(d, r.close);
    }
  }
  const ds = Array.from(dateSet).sort();
  if (ds.length < 6 || pm.size === 0) return null;   // 가격 데이터 없음/부족
  const d0 = ds[ds.length - 1];
  const d5 = ds[ds.length - 6];
  const d20 = ds.length >= 21 ? ds[ds.length - 21] : null;

  const rank = (dPast) => {
    if (!dPast) return [];
    const arr = [];
    for (const [code, m2] of pm) {
      const p0 = m2.get(d0), p1 = m2.get(dPast);
      if (p0 > 0 && p1 > 0) arr.push([code, p0 / p1 - 1]);
    }
    arr.sort((a, b) => b[1] - a[1]);
    return arr.slice(0, 10);
  };
  return { d0: d0, d5: d5, d20: d20, top5: rank(d5), top20: rank(d20) };
}

// ===== 초기화면 위젯 =====
// 현금·채권·선물 등 비주식 항목은 랭킹에서 제외
const NONEQ = /현금|예금|달러|엔화|유로|위안|스왑|선물|국고|통안|콜론|CD금리|KOFR|SOFR|전단채|채권|사채|만기|T-?Bill/i;

function renderIntro() {
  // ① 편입 비중합 TOP: 전체 ETF에 담긴 비중의 합 (해당일 기준)
  const sums = [];
  for (const name in DATA) {
    if (NONEQ.test(name)) continue;
    let s = 0, n = 0;
    for (const e of DATA[name]) if (e[2] != null && !LEV.test(e[1])) { s += e[2]; n++; }
    if (n > 0) sums.push([name, s, n]);
  }
  sums.sort((a, b) => b[1] - a[1]);
  const topW = sums.slice(0, 10);

  // ② 편입 비중 증가 TOP: N영업일 전 대비 비중합 변화(%p), 10일 우선
  const off = COMPS[10] ? 10 : COMPS[5] ? 5 : COMPS[1] ? 1 : null;
  let topD = [];
  if (off) {
    const deltas = [];
    for (const name in DATA) {
      if (NONEQ.test(name)) continue;
      let d = 0, has = false;
      for (const e of DATA[name]) {
        if (LEV.test(e[1])) continue;
        const dd = deltaFor(e[0], name, e[2], off);
        if (dd != null) { d += dd; has = true; }
      }
      if (has && d > 0.005) deltas.push([name, d]);
    }
    deltas.sort((a, b) => b[1] - a[1]);
    topD = deltas.slice(0, 10);
  }

  const row = (i, name, sub, bar, barCls, val, valCls) =>
    '<div class="wrow" onclick="searchComponent(\'' + safeAttr(name) + '\')">' +
    '<span class="wrank">' + (i + 1) + '</span>' +
    '<span class="wname">' + escHtml(name) + (sub ? '<span class="wsub">' + sub + '</span>' : '') + '</span>' +
    '<span class="wbar' + (barCls ? ' ' + barCls : '') + '" style="width:' + bar + 'px"></span>' +
    '<span class="wval' + (valCls ? ' ' + valCls : '') + '">' + val + '</span></div>';

  let html = '<div class="intro-hint">검색창에 종목명을 입력하거나, 아래 항목을 눌러보세요</div><div class="widgets">';

  // ETF 수익률 위젯 (가격 데이터 로드 후 채워짐, 클릭 시 보유내역으로 이동)
  const retRow = (i, code, r) => {
    const name = (typeof ETFS_CUR !== 'undefined' && ETFS_CUR[code]) || code;
    return '<div class="wrow" onclick="showEtfHoldings(\'' + safeAttr(code) + '\',\'' + safeAttr(name) + '\')">' +
      '<span class="wrank">' + (i + 1) + '</span>' +
      '<span class="wname">' + escHtml(name) + '</span>' +
      '<span class="wval ' + (r >= 0 ? 'up' : 'down') + '">' + (r >= 0 ? '+' : '') + (r * 100).toFixed(1) + '%</span></div>';
  };
  const retWidget = (title, emoji, top, dPast) => {
    let h = '<div class="widget"><h3>' + emoji + ' ' + title + '</h3>';
    if (!RET) {
      h += '<div class="sub">수정주가 불러오는 중&hellip;</div>';
    } else if (!top || !top.length) {
      h += '<div class="sub">가격 데이터가 없습니다</div>';
    } else {
      h += '<div class="sub">' + dPast + ' &rarr; ' + RET.d0 + ' 수정주가 기준 · 레버리지 제외</div>';
      top.forEach((t, i) => { h += retRow(i, t[0], t[1]); });
    }
    return h + '</div>';
  };
  html += retWidget('5영업일 수익률 TOP 10', '&#128640;', RET && RET.top5, RET && RET.d5);
  html += retWidget('20영업일 수익률 TOP 10', '&#128200;', RET && RET.top20, RET && RET.d20);

  html += '<div class="widget"><h3>&#127942; ETF 편입 비중합 TOP 10</h3>' +
    '<div class="sub">' + currentDate + ' 기준 · ETF에 담긴 비중(%)의 합 · 레버리지 제외</div>';
  const maxW = topW.length ? topW[0][1] : 0;
  topW.forEach((t, i) => {
    html += row(i, t[0], t[2] + '개 ETF', maxW ? Math.max(4, t[1] / maxW * 56) : 0, '',
      t[1].toLocaleString(undefined, { maximumFractionDigits: 0 }) + '%', '');
  });
  html += '</div>';

  html += '<div class="widget"><h3>&#128293; 편입 비중 증가 TOP 10</h3>' +
    '<div class="sub">' + (off ? off + '영업일 전(' + COMPS[off].date + ') 대비 비중합 변화(%p) · 레버리지 제외' : '비교할 과거 데이터가 없습니다') + '</div>';
  const maxD = topD.length ? topD[0][1] : 0;
  topD.forEach((t, i) => {
    html += row(i, t[0], '', maxD ? Math.max(4, t[1] / maxD * 56) : 0, 'hot', '+' + t[1].toFixed(1) + '%p', 'up');
  });
  html += '</div></div>';

  introArea.innerHTML = html;
}

async function loadDateData(date) {
  currentDate = date;
  currentView = null;
  viewHistory = [];
  selectedStocks = [];
  backBtnArea.style.display = 'none';
  tagsArea.style.display = 'none';

  introArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>' + date + ' 데이터를 불러오는 중...</p></div>';
  introArea.style.display = '';
  resultArea.style.display = 'none';
  statsArea.style.display = 'none';
  breadcrumb.style.display = 'none';
  searchInput.value = '';
  searchInput.disabled = true;

  try {
    // 현재 날짜 + 비교 날짜(1·5·10 영업일 전)를 병렬 로드
    const idx = DATES.indexOf(date);
    const offs = [1, 5, 10].filter(o => idx - o >= 0);
    const [cur, ...comps] = await Promise.all(
      [date, ...offs.map(o => DATES[idx - o])].map(fetchDateMap));

    COMPS = {};
    offs.forEach((o, i) => {
      const h = comps[i].holdings;
      const w = new Map(), codes = new Set();
      for (const code in h) {
        codes.add(code);
        for (let j = 0; j < h[code].length; j++) w.set(code + '|' + h[code][j][0], h[code][j][1]);
      }
      COMPS[o] = { date: DATES[idx - o], w: w, codes: codes };
    });

    HOLDINGS = cur.holdings;
    const ETFS = cur.etfs;
    ETFS_CUR = ETFS;
    // holdings(ETF→종목)를 뒤집어 data(종목→ETF)와 names를 즉석 생성
    DATA = {};
    const nameSet = new Set();
    for (const code in HOLDINGS) {
      const etfName = ETFS[code] || code;
      const items = HOLDINGS[code];
      for (let i = 0; i < items.length; i++) {
        const comp = items[i][0], w = items[i][1];
        (DATA[comp] || (DATA[comp] = [])).push([code, etfName, w]);
        nameSet.add(comp);
      }
    }
    NAMES = Array.from(nameSet).sort();

    dateInfo.textContent = NAMES.length.toLocaleString() + '개 종목 / ' + Object.keys(HOLDINGS).length.toLocaleString() + '개 ETF';

    searchInput.disabled = false;
    searchInput.placeholder = '종목명을 입력하세요 (예: 삼성전자, NVIDIA, SK하이닉스)';
    searchInput.focus();

    renderIntro();

    // 수익률 랭킹은 가격 파일 로드 후 비동기로 채움 (검색 사용을 막지 않음)
    RET = null;
    const reqDate = date;
    loadPrices(date, ETFS).then(ret => {
      if (currentDate !== reqDate) return;   // 로드 중 날짜가 바뀐 경우 무시
      RET = ret || { d0: null, d5: null, d20: null, top5: [], top20: [] };
      if (introArea.style.display !== 'none') renderIntro();
    });
  } catch (err) {
    introArea.innerHTML = '<div class="intro"><div class="emoji">&#9888;&#65039;</div>' +
      '<p>' + date + ' 데이터를 불러올 수 없습니다.</p></div>';
  }
}

dateSelect.addEventListener('change', function() {
  loadDateData(this.value);
});

// ===== UTILS =====
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightMatch(text, query) {
  if (!query) return escHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escHtml(text);
  return escHtml(text.substring(0, idx)) +
    '<span class="highlight">' + escHtml(text.substring(idx, idx + query.length)) + '</span>' +
    escHtml(text.substring(idx + query.length));
}

function safeAttr(s) {
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ===== STOCK SEARCH VIEW =====
function showStockResults(name) {
  const entries = DATA[name];
  if (!entries) {
    introArea.innerHTML = '<div class="intro"><p>검색 결과가 없습니다.</p></div>';
    introArea.style.display = '';
    resultArea.style.display = 'none';
    statsArea.style.display = 'none';
    breadcrumb.style.display = 'none';
    return;
  }

  if (!currentView || currentView.type !== 'stock' || currentView.name !== name) {
    if (currentView) viewHistory.push({...currentView});
  }
  currentView = { type: 'stock', name: name };
  backBtnArea.style.display = viewHistory.length > 0 ? '' : 'none';

  // 비중 + N영업일 전 대비 변화(%p) 계산
  const rows = entries.map(e => ({
    code: e[0] || '-', name: e[1], w: e[2],
    d1: deltaFor(e[0], name, e[2], 1),
    d5: deltaFor(e[0], name, e[2], 5),
    d10: deltaFor(e[0], name, e[2], 10)
  }));
  const key = stockSort;
  rows.sort((a, b) => ((b[key] == null ? -1e9 : b[key]) - (a[key] == null ? -1e9 : a[key])));
  const maxWeight = rows.reduce((m, r) => Math.max(m, r.w || 0), 0);

  breadcrumb.innerHTML = '<span class="current">&#128200; ' + escHtml(name) + ' 보유 ETF</span>';
  breadcrumb.style.display = 'flex';

  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">검색 종목</div><div class="value small">' + escHtml(name) + '</div></div>' +
    '<div class="stat-card"><div class="label">보유 ETF 수</div><div class="value">' + rows.length.toLocaleString() + '</div></div>' +
    '<div class="stat-card"><div class="label">최대 비중</div><div class="value">' + (maxWeight ? maxWeight.toFixed(2) + '%' : '-') + '</div></div>';
  statsArea.style.display = 'flex';

  const sortTh = (k, label, tip) => '<th class="th-sort' + (stockSort === k ? ' on' : '') +
    '" style="text-align:right" title="' + tip + '" onclick="setStockSort(\'' + k + '\')">' +
    label + (stockSort === k ? ' &#9660;' : '') + '</th>';
  thead.innerHTML = '<tr><th style="width:50px">#</th><th>ETF 종목명</th>' +
    sortTh('w', '비중(%)', '현재 비중 기준 정렬') +
    sortTh('d1', '&Delta;1일', (COMPS[1] ? COMPS[1].date + ' 대비 변화(%p)' : '비교 데이터 없음')) +
    sortTh('d5', '&Delta;5일', (COMPS[5] ? COMPS[5].date + ' 대비 변화(%p)' : '비교 데이터 없음')) +
    sortTh('d10', '&Delta;10일', (COMPS[10] ? COMPS[10].date + ' 대비 변화(%p)' : '비교 데이터 없음')) + '</tr>';

  const dcell = d => d == null ? '<td class="dcell">-</td>' :
    '<td class="dcell ' + (d > 0.005 ? 'd-up' : d < -0.005 ? 'd-down' : 'd-flat') + '">' +
    (d >= 0 ? '+' : '') + d.toFixed(2) + '</td>';

  let html = '';
  rows.forEach((r, i) => {
    const barWidth = maxWeight > 0 && r.w ? (r.w / maxWeight * 60) : 0;
    html += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
      '<td class="rank">' + (i + 1) + '</td>' +
      '<td class="etf-link">' + escHtml(r.name) + '<div class="code-sub">' + escHtml(r.code) + '</div></td>' +
      '<td class="weight">' +
        (r.w != null ? '<span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.w.toFixed(2) + '%' : '-') +
      '</td>' + dcell(r.d1) + dcell(r.d5) + dcell(r.d10) + '</tr>';
  });
  tbody.innerHTML = html;

  const sortLabel = { w: '비중(%)', d1: '1일 비중변화(%p)', d5: '5일 비중변화(%p)', d10: '10일 비중변화(%p)' };
  document.getElementById('resultTitle').textContent = '"' + name + '" 보유 ETF (' + rows.length + '개)';
  document.getElementById('sortInfo').textContent = sortLabel[stockSort] + ' 기준 내림차순 · 저장된 영업일 기준';
  introArea.style.display = 'none';
  resultArea.style.display = '';
}

function setStockSort(k) {
  stockSort = k;
  if (currentView && currentView.type === 'stock') {
    const nm = currentView.name;
    currentView = null;  // 히스토리 중복 방지 (같은 화면 재렌더)
    showStockResults(nm);
  }
}

// ===== ETF HOLDINGS VIEW =====
function showEtfHoldings(etfCode, etfName) {
  const items = HOLDINGS[etfCode];
  if (!items || items.length === 0) {
    alert('해당 ETF의 보유내역 정보가 없습니다.');
    return;
  }

  const fromStock = currentView && currentView.type === 'stock' ? currentView.name : null;
  if (currentView) viewHistory.push({...currentView});
  currentView = { type: 'etf', code: etfCode, name: etfName, fromStock: fromStock };
  backBtnArea.style.display = '';

  items.sort((a, b) => (b[1] || 0) - (a[1] || 0));
  const maxWeight = items.reduce((m, e) => Math.max(m, e[1] || 0), 0);

  let bc = '';
  if (fromStock) {
    bc += '<a onclick="showStockResults(\'' + safeAttr(fromStock) + '\')">' + escHtml(fromStock) + '</a>';
    bc += '<span class="sep">&#9654;</span>';
  }
  bc += '<span class="current">&#128188; ' + escHtml(etfName) + '</span>';
  breadcrumb.innerHTML = bc;
  breadcrumb.style.display = 'flex';

  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">ETF명</div><div class="value small">' + escHtml(etfName) + '</div></div>' +
    '<div class="stat-card"><div class="label">ETF 코드</div><div class="value small">' + escHtml(etfCode) + '</div></div>' +
    '<div class="stat-card"><div class="label">보유 종목 수</div><div class="value">' + items.length + '</div></div>';
  statsArea.style.display = 'flex';

  thead.innerHTML = '<tr><th style="width:50px">#</th><th>보유 종목명</th><th style="text-align:right;min-width:120px">비중(%)</th></tr>';

  let html = '';
  items.forEach((e, i) => {
    const compName = e[0];
    const weight = e[1];
    const barWidth = maxWeight > 0 && weight ? (weight / maxWeight * 80) : 0;
    const isHighlighted = fromStock && compName === fromStock;
    const rowClass = isHighlighted ? 'highlighted clickable' : 'clickable';
    html += '<tr class="' + rowClass + '" onclick="searchComponent(\'' + safeAttr(compName) + '\')">' +
      '<td class="rank">' + (i + 1) + '</td>' +
      '<td class="etf-link">' + escHtml(compName) + (isHighlighted ? ' &#11088;' : '') + '</td>' +
      '<td class="weight">' +
        (weight != null ? '<span class="weight-bar green" style="width:' + barWidth + 'px"></span>' + weight.toFixed(2) + '%' : '-') +
      '</td></tr>';
  });
  tbody.innerHTML = html;

  document.getElementById('resultTitle').textContent = escHtml(etfName) + ' 보유내역 (' + items.length + '개 종목)';
  document.getElementById('sortInfo').textContent = '비중(%) 기준 내림차순 정렬';
  introArea.style.display = 'none';
  resultArea.style.display = '';
}

function searchComponent(name) {
  selectedStocks = [name];
  searchInput.value = '';
  renderTags();
  showStockResults(name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== MULTI-STOCK TAG MANAGEMENT =====
function addStock(name) {
  if (selectedStocks.includes(name)) return;
  selectedStocks.push(name);
  searchInput.value = '';
  renderTags();
  triggerSearch();
}

function removeStock(name) {
  selectedStocks = selectedStocks.filter(s => s !== name);
  renderTags();
  if (selectedStocks.length === 0) {
    renderIntro();
    introArea.style.display = '';
    resultArea.style.display = 'none';
    statsArea.style.display = 'none';
    breadcrumb.style.display = 'none';
    backBtnArea.style.display = 'none';
  } else {
    triggerSearch();
  }
}

function clearAllStocks() {
  selectedStocks = [];
  renderTags();
  renderIntro();
  introArea.style.display = '';
  resultArea.style.display = 'none';
  statsArea.style.display = 'none';
  breadcrumb.style.display = 'none';
  backBtnArea.style.display = 'none';
}

function renderTags() {
  if (selectedStocks.length === 0) {
    tagsArea.style.display = 'none';
    return;
  }
  let html = selectedStocks.map(s =>
    '<span class="tag">' + escHtml(s) + ' <span class="remove" onclick="removeStock(\'' + safeAttr(s) + '\')">&times;</span></span>'
  ).join('');
  if (selectedStocks.length > 1) {
    html += '<button class="clear-btn" onclick="clearAllStocks()">전체 삭제</button>';
  }
  tagsArea.innerHTML = html;
  tagsArea.style.display = 'flex';
}

function triggerSearch() {
  viewHistory = [];
  currentView = null;
  backBtnArea.style.display = 'none';
  if (selectedStocks.length === 1) {
    showStockResults(selectedStocks[0]);
  } else if (selectedStocks.length >= 2) {
    showMultiStockResults();
  }
}

// ===== MULTI-STOCK COMBINED VIEW =====
function showMultiStockResults() {
  // Find ETFs that hold ALL selected stocks, sum their weights
  const etfWeights = {}; // etfCode -> {name, weights: {stock: weight}, total}

  selectedStocks.forEach(stockName => {
    const entries = DATA[stockName];
    if (!entries) return;
    entries.forEach(e => {
      const code = e[0];
      const etfName = e[1];
      const weight = e[2] || 0;
      if (!etfWeights[code]) {
        etfWeights[code] = { name: etfName, weights: {}, total: 0, count: 0 };
      }
      etfWeights[code].weights[stockName] = weight;
      etfWeights[code].total += weight;
      etfWeights[code].count++;
    });
  });

  // Filter: only ETFs that hold at least 1 selected stock, sort by total weight desc
  const results = Object.entries(etfWeights)
    .map(([code, info]) => ({ code, ...info }))
    .sort((a, b) => b.total - a.total);

  // Separate: ETFs with ALL stocks vs partial
  const allMatch = results.filter(r => r.count === selectedStocks.length);
  const partialMatch = results.filter(r => r.count < selectedStocks.length);

  currentView = { type: 'multi', names: [...selectedStocks] };

  const stockLabel = selectedStocks.join(' + ');
  const maxWeight = results.length > 0 ? results[0].total : 0;
  // 최대 합산 비중은 "모두 보유한" ETF 기준 (단일종목 레버리지 등 일부 보유 ETF 제외)
  const maxAllWeight = allMatch.length > 0 ? allMatch[0].total : 0;

  // Breadcrumb
  breadcrumb.innerHTML = '<span class="current">&#128200; ' + escHtml(stockLabel) + ' 합산 비중</span>';
  breadcrumb.style.display = 'flex';

  // Stats
  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">검색 종목</div><div class="value small">' + escHtml(stockLabel) + '</div></div>' +
    '<div class="stat-card"><div class="label">모두 보유 ETF</div><div class="value">' + allMatch.length + '</div></div>' +
    '<div class="stat-card"><div class="label">최대 합산 비중 (모두 보유)</div><div class="value">' + (maxAllWeight ? maxAllWeight.toFixed(2) + '%' : '-') + '</div></div>';
  statsArea.style.display = 'flex';

  // Table header: 합산 먼저, 개별 종목은 뒤에
  let thHtml = '<tr><th style="width:50px">#</th><th>ETF 종목명</th><th>ETF 코드</th>';
  thHtml += '<th style="text-align:right;min-width:100px">합산(%)</th>';
  selectedStocks.forEach(s => {
    thHtml += '<th style="text-align:right;min-width:80px">' + escHtml(s) + '</th>';
  });
  thHtml += '</tr>';
  thead.innerHTML = thHtml;

  // Table body: 합산 컬럼을 ETF코드 바로 다음에 배치
  function renderRows(list) {
    let html = '';
    list.forEach((r, i) => {
      const barWidth = maxWeight > 0 ? (r.total / maxWeight * 80) : 0;
      html += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
        '<td class="rank">' + (i + 1) + '</td>' +
        '<td class="etf-link">' + escHtml(r.name) + '</td>' +
        '<td class="code">' + escHtml(r.code) + '</td>' +
        '<td class="weight"><span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.total.toFixed(2) + '%</td>';
      selectedStocks.forEach(s => {
        const w = r.weights[s];
        html += '<td class="weight">' + (w != null ? w.toFixed(2) + '%' : '-') + '</td>';
      });
      html += '</tr>';
    });
    return html;
  }

  let bodyHtml = '';
  if (allMatch.length > 0) {
    bodyHtml += renderRows(allMatch);
  }
  if (partialMatch.length > 0 && allMatch.length > 0) {
    bodyHtml += '<tr><td colspan="' + (4 + selectedStocks.length) + '" style="padding:12px 16px;background:#f5f5f5;color:#888;font-size:13px;font-weight:600;">&#9660; 일부만 보유한 ETF (' + partialMatch.length + '개)</td></tr>';
  }
  if (partialMatch.length > 0) {
    let partialHtml = '';
    partialMatch.forEach((r, i) => {
      const barWidth = maxWeight > 0 ? (r.total / maxWeight * 80) : 0;
      partialHtml += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
        '<td class="rank" style="color:#999">' + (i + 1) + '</td>' +
        '<td class="etf-link">' + escHtml(r.name) + '</td>' +
        '<td class="code">' + escHtml(r.code) + '</td>' +
        '<td class="weight"><span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.total.toFixed(2) + '%</td>';
      selectedStocks.forEach(s => {
        const w = r.weights[s];
        partialHtml += '<td class="weight">' + (w != null ? w.toFixed(2) + '%' : '-') + '</td>';
      });
      partialHtml += '</tr>';
    });
    bodyHtml += partialHtml;
  }

  tbody.innerHTML = bodyHtml;

  document.getElementById('resultTitle').textContent = stockLabel + ' 합산 비중 (' + results.length + '개 ETF)';
  document.getElementById('sortInfo').textContent = '합산 비중(%) 기준 내림차순 정렬';
  introArea.style.display = 'none';
  resultArea.style.display = '';
}

function goBack() {
  if (viewHistory.length === 0) return;
  const prev = viewHistory.pop();
  currentView = null; // prevent double-push
  if (prev.type === 'stock') {
    selectedStocks = [prev.name];
    searchInput.value = '';
    renderTags();
    showStockResults(prev.name);
  } else if (prev.type === 'etf') {
    showEtfHoldings(prev.code, prev.name);
  } else if (prev.type === 'multi') {
    selectedStocks = [...prev.names];
    searchInput.value = '';
    renderTags();
    showMultiStockResults();
  }
  backBtnArea.style.display = viewHistory.length > 0 ? '' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== AUTOCOMPLETE =====
function updateAutocomplete() {
  const q = searchInput.value.trim();
  if (q.length === 0) { autocompleteEl.style.display = 'none'; acFiltered = []; acIndex = -1; return; }
  const ql = q.toLowerCase();
  acFiltered = NAMES.filter(n => n.toLowerCase().includes(ql)).slice(0, 50);
  acIndex = -1;
  if (acFiltered.length === 0) { autocompleteEl.style.display = 'none'; return; }
  autocompleteEl.innerHTML = acFiltered.map((n, i) =>
    '<div class="item" data-idx="' + i + '">' + highlightMatch(n, q) + '</div>'
  ).join('');
  autocompleteEl.style.display = 'block';
  autocompleteEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('mousedown', function(e) {
      e.preventDefault();
      selectItem(parseInt(this.dataset.idx));
    });
  });
}

function selectItem(idx) {
  if (idx < 0 || idx >= acFiltered.length) return;
  const name = acFiltered[idx];
  autocompleteEl.style.display = 'none';
  addStock(name);
}

function highlightItem(idx) {
  const items = autocompleteEl.querySelectorAll('.item');
  items.forEach(el => el.classList.remove('active'));
  if (idx >= 0 && idx < items.length) {
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  }
}

searchInput.addEventListener('input', updateAutocomplete);
searchInput.addEventListener('keydown', function(e) {
  if (autocompleteEl.style.display === 'none' || acFiltered.length === 0) {
    if (e.key === 'Enter') {
      const q = searchInput.value.trim();
      if (DATA[q]) { addStock(q); }
      else {
        const match = NAMES.find(n => n.toLowerCase() === q.toLowerCase());
        if (match) { addStock(match); }
      }
    }
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, acFiltered.length - 1); highlightItem(acIndex); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightItem(acIndex); }
  else if (e.key === 'Enter') { e.preventDefault(); if (acIndex >= 0) selectItem(acIndex); else if (acFiltered.length > 0) selectItem(0); }
  else if (e.key === 'Escape') { autocompleteEl.style.display = 'none'; }
});
searchInput.addEventListener('blur', function() { setTimeout(() => { autocompleteEl.style.display = 'none'; }, 150); });
searchInput.addEventListener('focus', function() { if (searchInput.value.trim().length > 0) updateAutocomplete(); });

// ===== START =====
init();
</script>
</body>
</html>
