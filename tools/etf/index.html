<script>
// ===== STATE =====
let DATA = {};
let NAMES = [];
let HOLDINGS = {};
let DATES = [];        // 저장된 영업일 목록 (오름차순)
let COMPS = {};        // {1:{date,w,codes}, 5:{...}, 10:{...}} — N영업일 전 비중 비교용
let RET = null;        // ETF 수익률 랭킹 {top5:[[code,r]], top20:[], d0,d5,d20} (db/market/price 기반)
let TPM = null;        // 목표주가 모멘텀 {up:[[code,score,cov]], down:[], d0, d20} (db/market/consensus 기반)
let RSM = null;        // RS 등급 급등 {top:[[name,delta,rs0]], d0, d20} (db/market/rs 기반)
let OPM = null;        // 이익 컨센서스 상향 ETF — 연도별 [{fy, d0, d10, d20, top10:[[code,chg,cov]], top20:[...]}] (db/market/earnings/consensus 기반)
let ETFS_CUR = {};     // 현재 날짜의 etfCode -> etfName
let stockSort = 'w';   // 종목 검색 정렬: 'w'|'d1'|'d5'|'d10'
let stockSortDir = -1; // -1 내림차순, 1 오름차순 (같은 컬럼 재클릭 시 토글)
let currentDate = null;
let currentView = null;
let acIndex = -1;
let acFiltered = [];
let selectedStocks = [];

// ===== DOM =====
const dateSelect = document.getElementById('dateSelect');
const dateInfo = document.getElementById('dateInfo');
const searchInput = document.getElementById('searchInput');
const autocompleteEl = document.getElementById('autocomplete');
const statsArea = document.getElementById('statsArea');
const resultArea = document.getElementById('resultArea');
const introArea = document.getElementById('introArea');
const tbody = document.getElementById('tbody');
const thead = document.getElementById('thead');
const breadcrumb = document.getElementById('breadcrumb');
const chartArea = document.getElementById('chartArea');
const backBtnArea = document.getElementById('backBtnArea');
const tagsArea = document.getElementById('tagsArea');
let restoring = false;   // 주소(쿼리스트링)로부터 화면 복원 중이면 pushState 억제

// ===== URL / 브라우저 히스토리 동기화 =====
// 화면 상태를 쿼리스트링에 반영 — 브라우저 뒤로가기·새로고침·링크 공유 지원
function urlForState() {
  const p = new URLSearchParams();
  const latest = DATES[DATES.length - 1];
  if (currentDate && (currentView || currentDate !== latest)) p.set('date', currentDate);
  if (currentView) {
    if (currentView.type === 'stock') p.set('stock', currentView.name);
    else if (currentView.type === 'etf') {
      p.set('etf', currentView.code);
      if (currentView.fromStock) p.set('from', currentView.fromStock);
    } else if (currentView.type === 'multi') p.set('stocks', currentView.names.join(','));
  }
  const q = p.toString();
  return location.pathname + (q ? '?' + q : '');
}

function updateBackBtn() {
  const depth = (history.state && history.state.depth) || 0;
  backBtnArea.style.display = (depth > 0 && currentView) ? '' : 'none';
}

// 렌더 함수 말미에서 호출: 화면이 바뀌었으면 pushState, 같은 화면 재렌더면 replaceState
function syncUrl() {
  if (restoring) return;
  const url = urlForState();
  const depth = (history.state && history.state.depth) || 0;
  if (location.pathname + location.search === url) {
    history.replaceState({ depth: depth }, '', url);
  } else {
    history.pushState({ depth: depth + 1 }, '', url);
  }
  updateBackBtn();
}

// 현재 주소의 쿼리스트링대로 화면 복원 (pushState 없이) — 초기 진입·popstate 공용
async function applyStateFromUrl() {
  if (!DATES.length) return;
  const p = new URLSearchParams(location.search);
  restoring = true;
  try {
    const date = p.get('date');
    const target = (date && DATES.includes(date)) ? date : DATES[DATES.length - 1];
    if (target !== currentDate) {
      dateSelect.value = target;
      await loadDateData(target);
    }
    const etf = p.get('etf');
    const stock = p.get('stock');
    const multi = (p.get('stocks') || '').split(',').filter(n => DATA[n]);
    const single = (stock && DATA[stock]) ? stock : (multi.length === 1 ? multi[0] : null);
    if (etf && HOLDINGS[etf]) {
      const from = p.get('from');
      const hasFrom = from && DATA[from];
      currentView = hasFrom ? { type: 'stock', name: from } : null;  // fromStock 유도용
      selectedStocks = hasFrom ? [from] : [];
      renderTags();
      showEtfHoldings(etf, ETFS_CUR[etf] || etf);
    } else if (multi.length >= 2) {
      selectedStocks = multi;
      renderTags();
      showMultiStockResults();
    } else if (single) {
      currentView = null;
      selectedStocks = [single];
      renderTags();
      showStockResults(single);
    } else {
      clearAllStocks();
    }
  } finally {
    restoring = false;
  }
  updateBackBtn();
}

window.addEventListener('popstate', function() { applyStateFromUrl(); });

// ===== INIT =====
async function init() {
  try {
    const resp = await fetch('data/dates.json');
    const dates = await resp.json();

    ).join('');

  }
}

// ===== Load date data =====
// 날짜 하나의 데이터를 로드 (db/etf/*.parquet를 hyparquet로 직접 읽음)
async function fetchDateMap(date) {
  const buf = await (await fetch('/db/etf/' + date + '.parquet')).arrayBuffer();
  const rows = await hyparquet.parquetReadObjects({ file: buf });
  const etfs = {}, holdings = {};
  for (const r of rows) {
    etfs[r.etf_code] = r.etf_name;
    (holdings[r.etf_code] || (holdings[r.etf_code] = []))
      .push([r.stock_name, r.weight == null ? null : Math.round(r.weight * 1000) / 1000]);
  }
  return { etfs: etfs, holdings: holdings };
}

// N영업일 전 대비 비중 변화(%p). ETF가 비교일에 없으면 null, 미보유였으면 +현재비중(신규 편입)
function deltaFor(code, stock, curW, off) {
  const c = COMPS[off];
  if (!c || curW == null || !c.codes.has(code)) return null;
  return curW - (c.w.get(code + '|' + stock) || 0);
}

// 레버리지·인버스 ETF는 수익률·편입 비중 랭킹에서 제외
const LEV = /레버리지|인버스|곱버스/i;

// ===== ETF 수익률 (db/market/price 월별 수정주가) =====
// 기준일 포함 최근 3개월 파일을 읽어 5·20영업일 수익률 랭킹을 계산
async function loadPrices(date, etfMap) {
  const etfCodes = new Set(Object.keys(etfMap).filter(c => !LEV.test(etfMap[c] || '')));
  const months = [];
  const [y, m] = [parseInt(date.slice(0, 4)), parseInt(date.slice(5, 7))];
  for (let k = 2; k >= 0; k--) {
    const mm = m - k, yy = y + Math.floor((mm - 1) / 12), mo = ((mm - 1) % 12 + 12) % 12 + 1;
    months.push(yy + '-' + String(mo).padStart(2, '0'));
  }
  const chunks = await Promise.all(months.map(async mo => {
    try {
      const resp = await fetch('/db/market/price/' + mo + '.parquet');
      if (!resp.ok) return [];
      return await hyparquet.parquetReadObjects({ file: await resp.arrayBuffer() });
    } catch (e) { return []; }
  }));

  const dateSet = new Set();
  const pm = new Map();   // code -> Map(dateStr -> close)
  for (const rows of chunks) {
    for (const r of rows) {
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d > date) continue;
      dateSet.add(d);
      if (!etfCodes.has(r.code)) continue;
      let m2 = pm.get(r.code);
      if (!m2) pm.set(r.code, m2 = new Map());
      m2.set(d, r.close);
    }
  }
  const ds = Array.from(dateSet).sort();
  if (ds.length < 2 || pm.size === 0) return null;   // 가격 데이터 없음/부족
  const d0 = ds[ds.length - 1];
  const d1 = ds[ds.length - 2];
  const d5 = ds.length >= 6 ? ds[ds.length - 6] : null;
  const d20 = ds.length >= 21 ? ds[ds.length - 21] : null;

  const rank = (dPast) => {
    if (!dPast) return [];
    const arr = [];
    for (const [code, m2] of pm) {
      const p0 = m2.get(d0), p1 = m2.get(dPast);
      if (p0 > 0 && p1 > 0) arr.push([code, p0 / p1 - 1]);
    }
    arr.sort((a, b) => b[1] - a[1]);
    return arr.slice(0, 10);
  };
  return { d0: d0, d1: d1, d5: d5, d20: d20,
           top1: rank(d1), top5: rank(d5), top20: rank(d20) };
}

// ===== 목표주가 모멘텀 (db/market/consensus 월별 컨센서스) =====
// 각 ETF에 대해 Σ(구성종목 목표주가의 20영업일 변화율 × 비중)을 계산
async function loadConsensus(date) {
  const months = [];
  const [y, m] = [parseInt(date.slice(0, 4)), parseInt(date.slice(5, 7))];
  for (let k = 2; k >= 0; k--) {
    const mm = m - k, yy = y + Math.floor((mm - 1) / 12), mo = ((mm - 1) % 12 + 12) % 12 + 1;
    months.push(yy + '-' + String(mo).padStart(2, '0'));
  }
  const chunks = await Promise.all(months.map(async mo => {
    try {
      const resp = await fetch('/db/market/consensus/' + mo + '.parquet');
      if (!resp.ok) return [];
      return await hyparquet.parquetReadObjects({ file: await resp.arrayBuffer() });
    } catch (e) { return []; }
  }));

  const dateSet = new Set();
  const tp = new Map();   // 종목명 -> Map(dateStr -> 목표주가)
  for (const rows of chunks) {
    for (const r of rows) {
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d > date) continue;
      dateSet.add(d);
      let m2 = tp.get(r.name);
      if (!m2) tp.set(r.name, m2 = new Map());
      m2.set(d, r.target_price);
    }
  }
  const ds = Array.from(dateSet).sort();
  if (ds.length < 21 || tp.size === 0) return null;
  const d0 = ds[ds.length - 1];
  const d20 = ds[ds.length - 21];

  // ETF별 가중 목표주가 변화율 (커버리지 비중 20% 이상만)
  const scores = [];
  for (const code in HOLDINGS) {
    const etfName = ETFS_CUR[code] || '';
    if (LEV.test(etfName)) continue;
    let score = 0, cov = 0;
    for (const [stock, w] of HOLDINGS[code]) {
      if (w == null) continue;
      const m2 = tp.get(stock);
      if (!m2) continue;
      const t0 = m2.get(d0), t1 = m2.get(d20);
      if (t0 > 0 && t1 > 0) { score += (t0 / t1 - 1) * w / 100; cov += w; }
    }
    if (cov >= 20) scores.push([code, score, cov]);
  }
  scores.sort((a, b) => b[1] - a[1]);
  // 개별 종목의 20영업일 목표주가 변화율 (검색 가능한 종목만)
  const stocks = [];
  for (const [nm, m2] of tp) {
    if (!DATA[nm]) continue;
    const t0 = m2.get(d0), t1 = m2.get(d20);
    if (t0 > 0 && t1 > 0) stocks.push([nm, t0 / t1 - 1]);
  }
  stocks.sort((a, b) => b[1] - a[1]);

  return { d0: d0, d20: d20, up: scores.slice(0, 10),
           down: scores.filter(s => s[1] < 0).slice(-10).reverse(),
           stockUp: stocks.filter(s => s[1] > 0.0005).slice(0, 10),
           stockDown: stocks.filter(s => s[1] < -0.0005).slice(-10).reverse() };
}

// ===== 종목 차트: 최근 1년 수정주가 vs 목표주가 =====
const FILE_BUFS = new Map();     // 'p|YYYY-MM' / 'c|YYYY-MM' -> ArrayBuffer|null (네트워크 캐시)
const SERIES_CACHE = new Map();  // '종목명|기준일' -> {price:[[d,v]], tp:[[d,v]]}
let chartToken = 0;

function monthsList(date, n) {
  const out = [];
  const [y, m] = [parseInt(date.slice(0, 4)), parseInt(date.slice(5, 7))];
  for (let k = n - 1; k >= 0; k--) {
    const mm = m - k, yy = y + Math.floor((mm - 1) / 12), mo = ((mm - 1) % 12 + 12) % 12 + 1;
    out.push(yy + '-' + String(mo).padStart(2, '0'));
  }
  return out;
}

const DB_DIR = { p: 'price', c: 'consensus', r: 'rs', e: 'earnings/consensus' };
async function readMonth(kind, mo) {
  const key = kind + '|' + mo;
  let buf = FILE_BUFS.get(key);
  if (buf === undefined) {
    try {
      const resp = await fetch('/db/market/' + DB_DIR[kind] + '/' + mo + '.parquet');
      buf = resp.ok ? await resp.arrayBuffer() : null;
    } catch (e) { buf = null; }
    FILE_BUFS.set(key, buf);
  }
  if (!buf) return [];
  return hyparquet.parquetReadObjects({ file: buf });
}

// name으로 매칭(일반 종목: 컨센서스 포함) 또는 code로 매칭(ETF: 수정주가만)
async function loadStockSeries(name, code) {
  const key = (code ? 'C:' + code : 'N:' + name) + '|' + currentDate;
  if (SERIES_CACHE.has(key)) return SERIES_CACHE.get(key);
  const from = (parseInt(currentDate.slice(0, 4)) - 1) + currentDate.slice(4);
  const price = [], tp = [];
  await Promise.all(monthsList(currentDate, 13).map(async mo => {
    const [prows, crows] = await Promise.all(
      [readMonth('p', mo), code ? Promise.resolve([]) : readMonth('c', mo)]);
    for (const r of prows) {
      if (code ? r.code !== code : r.name !== name) continue;
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d >= from && d <= currentDate && r.close > 0) price.push([d, r.close]);
    }
    for (const r of crows) {
      if (r.name !== name) continue;
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d >= from && d <= currentDate && r.target_price > 0) tp.push([d, r.target_price]);
    }
  }));
  price.sort((a, b) => a[0] < b[0] ? -1 : 1);
  tp.sort((a, b) => a[0] < b[0] ? -1 : 1);
  const res = { price: price, tp: tp, from: from };
  SERIES_CACHE.set(key, res);
  return res;
}

function showStockChart(name) {
  const tok = ++chartToken;
  chartArea.style.display = '';
  chartArea.innerHTML = '<div class="chart-card"><div class="chart-title">&#128201; ' + escHtml(name) +
    ' &middot; 최근 1년</div><div class="chart-loading">가격 데이터를 불러오는 중&hellip;</div></div>';
  Promise.all([loadStockSeries(name), loadRsSeries(name)]).then(([s, rs]) => {
    if (tok !== chartToken) return;
    if (!currentView || currentView.type !== 'stock' || currentView.name !== name) return;
    renderStockChart(name, Object.assign({ rs: rs }, s));
  });
  showEarnings(name);
}

// 오닐식 RS 등급(1~99) 시계열 — db/market/rs (일반 종목 모집단 대비 백분위, ETF도 같은 분포로 등급)
async function loadRsSeries(name, code) {
  const key = 'R:' + (code ? 'C:' + code : 'N:' + name) + '|' + currentDate;
  if (SERIES_CACHE.has(key)) return SERIES_CACHE.get(key);
  const from = (parseInt(currentDate.slice(0, 4)) - 1) + currentDate.slice(4);
  const out = [];
  await Promise.all(monthsList(currentDate, 13).map(async mo => {
    for (const r of await readMonth('r', mo)) {
      if (code ? r.code !== code : r.name !== name) continue;
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d >= from && d <= currentDate) out.push([d, r.rs]);
    }
  }));
  out.sort((a, b) => a[0] < b[0] ? -1 : 1);
  SERIES_CACHE.set(key, out);
  return out;
}

function showEtfChart(code, name) {
  const tok = ++chartToken;
  chartArea.style.display = '';
  chartArea.innerHTML = '<div class="chart-card"><div class="chart-title">&#128201; ' + escHtml(name) +
    ' &middot; 최근 1년</div><div class="chart-loading">가격 데이터를 불러오는 중&hellip;</div></div>';
  Promise.all([loadStockSeries(name, code), loadRsSeries(name, code)]).then(([s, rs]) => {
    if (tok !== chartToken) return;
    if (!currentView || currentView.type !== 'etf' || currentView.code !== code) return;
    renderStockChart(name, Object.assign({ isEtf: true, rs: rs }, s));
  });
}

function hideStockChart() {
  chartToken++;
  chartArea.style.display = 'none';
  chartArea.innerHTML = '';
  earnArea.style.display = 'none';
  earnArea.innerHTML = '';
}

// ===== 연도별 영업이익 증가율 (db/market/earnings) =====
const earnArea = document.getElementById('earnArea');
let EARN = null;   // Map(종목명 -> {code, fy: Map(fy -> [op, src])})

async function loadEarnings() {
  if (EARN) return EARN;
  EARN = (async () => {
    const resp = await fetch('/db/market/earnings/annual.parquet');
    if (!resp.ok) return null;
    const rows = await hyparquet.parquetReadObjects({ file: await resp.arrayBuffer() });
    const m = new Map();
    for (const r of rows) {
      let e = m.get(r.name);
      if (!e) m.set(r.name, e = { code: r.code, fy: new Map() });
      e.fy.set(Number(r.fy), [r.op, r.src]);
    }
    return m;
  })().catch(() => null);
  return EARN;
}

const fmtOp = v => {   // 천원 -> 조/억
  const abs = Math.abs(v);
  if (abs >= 1e9) return (v / 1e9).toFixed(1) + '조원';
  if (abs >= 1e5) return Math.round(v / 1e5).toLocaleString() + '억원';
  return Math.round(v / 10).toLocaleString() + '만원';
};

function showEarnings(name) {
  const tok = chartToken;
  earnArea.style.display = 'none';
  earnArea.innerHTML = '';
  loadEarnings().then(m => {
    if (tok !== chartToken || !m) return;
    if (!currentView || currentView.type !== 'stock' || currentView.name !== name) return;
    const e = m.get(name);
    if (!e) return;                                  // 실적 데이터 없는 종목은 카드 생략
    const fys = Array.from(e.fy.keys()).sort((a, b) => a - b);
    let cells = '';
    for (const fy of fys) {
      if (fy < 2020) continue;                       // 표시 시작 연도 (기준치는 전년도 사용)
      const cur = e.fy.get(fy), prev = e.fy.get(fy - 1);
      if (!cur) continue;
      const est = cur[1] === 'E';
      let gv, cls;
      if (!prev) { gv = '-'; cls = 'flat'; }
      else if (prev[0] > 0 && cur[0] > 0) {
        const g = (cur[0] / prev[0] - 1) * 100;
        gv = (g >= 0 ? '+' : '') + (Math.abs(g) >= 100 ? g.toFixed(0) : g.toFixed(1)) + '%';
        cls = g > 0.05 ? 'up' : g < -0.05 ? 'down' : 'flat';
      }
      else if (prev[0] <= 0 && cur[0] > 0) { gv = '흑전'; cls = 'up'; }
      else if (prev[0] > 0 && cur[0] <= 0) { gv = '적전'; cls = 'down'; }
      else { gv = '적지'; cls = 'flat'; }
      const opEok = Math.round(cur[0] / 1e5);   // 천원 -> 억원
      const click = est
        ? 'clickEstYear(this,\'' + safeAttr(e.code) + '\',\'' + safeAttr(name) + '\',' + fy + ')'
        : 'toggleEarnQ(this,\'' + safeAttr(e.code) + '\',' + fy + ')';
      cells += '<tr class="est" onclick="' + click + '">' +
        '<td class="yr">' + fy + (est ? '<span class="e-badge">E</span>' : '') + '</td>' +
        '<td class="op">' + opEok.toLocaleString() + '<span class="unit">억</span></td>' +
        '<td class="gv ' + cls + '">' + gv + '</td>' +
        '<td class="chev">' + (est ? '&#9656; 추이' : '&#9656; 분기') + '</td></tr>';
    }
    if (!cells) return;
    earnArea.innerHTML = '<div class="chart-card">' +
      '<div class="chart-title">&#128202; ' + escHtml(name) + ' &middot; 연도별 영업이익 증가율</div>' +
      '<div class="chart-sub">영업이익(억원) · 증가율은 전년 대비(YoY) · E = 컨센서스, 클릭하면 최근 1년 추정치 추이</div>' +
      '<table class="earn-tbl">' + cells + '</table>' +
      '<div id="earnCons" style="display:none"></div></div>';
    earnArea.style.display = '';
  });
}

// 분기별 영업이익 (확정 연도 클릭 시 토글)
let EARN_Q = null;   // Map(code -> Map(fy*10+q -> op))
function loadQuarterly() {
  if (EARN_Q) return EARN_Q;
  EARN_Q = (async () => {
    const resp = await fetch('/db/market/earnings/quarterly.parquet');
    if (!resp.ok) return null;
    const rows = await hyparquet.parquetReadObjects({ file: await resp.arrayBuffer() });
    const m = new Map();
    for (const r of rows) {
      let e = m.get(r.code);
      if (!e) m.set(r.code, e = new Map());
      e.set(Number(r.fy) * 10 + Number(r.q), r.op);
    }
    return m;
  })().catch(() => null);
  return EARN_Q;
}

const growthCell = (cur, prev) => {   // [표시문자열, 색상클래스]
  if (prev == null) return ['-', 'flat'];
  if (prev > 0 && cur > 0) {
    const g = (cur / prev - 1) * 100;
    return [(g >= 0 ? '+' : '') + (Math.abs(g) >= 100 ? g.toFixed(0) : g.toFixed(1)) + '%',
            g > 0.05 ? 'up' : g < -0.05 ? 'down' : 'flat'];
  }
  if (prev <= 0 && cur > 0) return ['흑전', 'up'];
  if (prev > 0 && cur <= 0) return ['적전', 'down'];
  return ['적지', 'flat'];
};

async function toggleEarnQ(cell, code, fy) {
  // 이미 펼쳐져 있으면 접기 (해당 연도 행 바로 아래의 분기 행 제거)
  let removed = false;
  let nxt = cell.nextElementSibling;
  while (nxt && nxt.classList.contains('qrow')) {
    const t = nxt;
    nxt = nxt.nextElementSibling;
    t.remove();
    removed = true;
  }
  cell.classList.remove('on');
  if (removed) return;

  cell.classList.add('on');
  const m = await loadQuarterly();
  if (!cell.isConnected || !cell.classList.contains('on')) return;   // 그 사이 화면 전환/재클릭
  let rows = qRowsHtml(m && m.get(code), fy);
  if (!rows) rows = '<tr class="qrow"><td class="yr" colspan="4" style="color:#aaa">분기 실적 데이터가 없습니다</td></tr>';
  cell.insertAdjacentHTML('afterend', rows);
}

function qRowsHtml(e, fy) {
  let rows = '';
  if (!e) return rows;
  for (let q = 1; q <= 4; q++) {
    const cur = e.get(fy * 10 + q);
    if (cur == null) continue;
    const [gv, cls] = growthCell(cur, e.get((fy - 1) * 10 + q));
    rows += '<tr class="qrow"><td class="yr">' + q + 'Q</td>' +
      '<td class="op">' + Math.round(cur / 1e5).toLocaleString() + '<span class="unit">억</span></td>' +
      '<td class="gv ' + cls + '">' + gv + '</td>' +
      '<td class="chev">' + (q === 1 ? 'YoY' : '') + '</td></tr>';
  }
  return rows;
}

// E 연도 클릭: 확정된 분기 실적(있으면)과 컨센서스 추이 차트를 동시에 토글
async function clickEstYear(cell, code, name, fy) {
  const box = document.getElementById('earnCons');
  const key = code + '|' + fy;
  // 펼쳐져 있던 분기 행 제거
  let removed = false;
  let nxt = cell.nextElementSibling;
  while (nxt && nxt.classList.contains('qrow')) {
    const t = nxt;
    nxt = nxt.nextElementSibling;
    t.remove();
    removed = true;
  }
  if (cell.classList.contains('on') && (removed || earnConsKey === key)) {   // 닫기: 둘 다
    cell.classList.remove('on');
    if (earnConsKey === key && box) { box.style.display = 'none'; earnConsKey = null; }
    return;
  }
  toggleEarnCons(cell, code, name, fy);            // 차트 열기 (+ 'on' 표시)
  const m = await loadQuarterly();
  if (!cell.isConnected || !cell.classList.contains('on')) return;
  const rows = qRowsHtml(m && m.get(code), fy);    // 확정 분기가 있으면 행 바로 아래에
  if (rows) cell.insertAdjacentHTML('afterend', rows);
}

// 컨센서스 추이 미니 차트 (E 연도용 — clickEstYear에서 분기 행과 함께 토글)
let earnConsKey = null;
let earnConsRow = null;
async function toggleEarnCons(cell, code, name, fy) {
  const box = document.getElementById('earnCons');
  if (!box) return;
  const key = code + '|' + fy;
  if (earnConsRow && earnConsRow !== cell && earnConsRow.isConnected) {
    // 다른 E 연도로 전환: 이전 행의 하이라이트·분기 행 정리
    earnConsRow.classList.remove('on');
    let nxt = earnConsRow.nextElementSibling;
    while (nxt && nxt.classList.contains('qrow')) { const t = nxt; nxt = nxt.nextElementSibling; t.remove(); }
  }
  if (earnConsKey === key && box.style.display !== 'none') {   // 같은 셀 재클릭 -> 닫기
    cell.classList.remove('on');
    box.style.display = 'none';
    earnConsKey = null;
    earnConsRow = null;
    return;
  }
  earnConsKey = key;
  earnConsRow = cell;
  cell.classList.add('on');
  box.style.display = '';
  box.innerHTML = '<div class="chart-loading">컨센서스 추이를 불러오는 중&hellip;</div>';

  const from = (parseInt(currentDate.slice(0, 4)) - 1) + currentDate.slice(4);
  const series = [];
  await Promise.all(monthsList(currentDate, 13).map(async mo => {
    for (const r of await readMonth('e', mo)) {
      if (r.code !== code || Number(r.fy) !== fy) continue;
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d >= from && d <= currentDate) series.push([d, r.op]);
    }
  }));
  if (earnConsKey !== key) return;
  series.sort((a, b) => a[0] < b[0] ? -1 : 1);
  if (series.length < 2) {
    box.innerHTML = '<div class="chart-loading">최근 1년 컨센서스 추이 데이터가 없습니다</div>';
    return;
  }

  const W = Math.max(300, earnArea.clientWidth - 40), H = 170;
  const L = 66, R = 12, T = 26, B = 30;
  const x0 = Date.parse(series[0][0]), x1 = Date.parse(series[series.length - 1][0]);
  let vmin = Infinity, vmax = -Infinity;
  for (const [, v] of series) { if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
  const pad = (vmax - vmin) * 0.12 || Math.abs(vmax) * 0.05 || 1;
  vmin -= pad; vmax += pad;
  const X = d => L + (Date.parse(d) - x0) / Math.max(x1 - x0, 1) * (W - L - R);
  const Y = v => T + (vmax - v) / (vmax - vmin) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const v = vmin + (vmax - vmin) * i / 2, y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#eee"/>' +
      '<text x="' + (L - 8) + '" y="' + y + '" text-anchor="end" dominant-baseline="middle" font-size="10" fill="#999">' + fmtOp(v) + '</text>';
  }
  g += '<text x="' + L + '" y="14" font-size="11" font-weight="600" fill="#666">' + fy +
    'E 영업이익 컨센서스 추이 (최근 1년)</text>';
  // X축 날짜 라벨 (격월 YY.MM)
  for (const mo of monthsList(currentDate, 13).filter((m, i) => i % 2 === 1)) {
    const t = Date.parse(mo + '-01');
    if (t < x0 || t > x1) continue;
    g += '<text x="' + X(mo + '-01').toFixed(1) + '" y="' + (H - 8) +
      '" text-anchor="middle" font-size="10" fill="#999">' + mo.slice(2).replace('-', '.') + '</text>';
  }
  const path = series.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const first = series[0][1], last = series[series.length - 1][1];
  const chg = first > 0 ? ' &middot; 1년간 ' + ((last / first - 1) * 100).toFixed(1) + '%' : '';
  g += '<path d="' + path + '" fill="none" stroke="#3f51b5" stroke-width="1.8"/>';
  box.innerHTML = '<div class="chart-wrap" style="margin-top:10px"><svg viewBox="0 0 ' + W + ' ' + H + '">' + g +
    '<line id="ecCross" x1="0" y1="' + T + '" x2="0" y2="' + (H - B) + '" stroke="#bbb" stroke-dasharray="2 2" style="display:none"/>' +
    '<circle id="ecDot" r="3" fill="#3f51b5" style="display:none"/>' +
    '</svg><div class="chart-tip" id="ecTip"></div></div>' +
    '<div class="chart-sub" style="margin:4px 0 0">현재 ' + fmtOp(last) + chg + '</div>';

  // 호버 툴팁: 가장 가까운 날짜의 컨센서스 값 + 직전 변경일 대비 변화
  const svg = box.querySelector('svg');
  const tip = document.getElementById('ecTip');
  const cross = document.getElementById('ecCross');
  const dot = document.getElementById('ecDot');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width * W;
    if (mx < L || mx > W - R) { tip.style.display = 'none'; cross.style.display = 'none'; dot.style.display = 'none'; return; }
    let bi = 0;
    for (let i = 1; i < series.length; i++)
      if (Math.abs(X(series[i][0]) - mx) < Math.abs(X(series[bi][0]) - mx)) bi = i;
    const [d, v] = series[bi];
    const pv = bi > 0 ? series[bi - 1][1] : null;
    const dchg = (pv && pv > 0 && Math.abs(v / pv - 1) > 0.0005)
      ? ' <span style="opacity:.75">(' + ((v / pv - 1) * 100 >= 0 ? '+' : '') + ((v / pv - 1) * 100).toFixed(1) + '%)</span>' : '';
    cross.setAttribute('x1', X(d)); cross.setAttribute('x2', X(d)); cross.style.display = '';
    dot.setAttribute('cx', X(d)); dot.setAttribute('cy', Y(v)); dot.style.display = '';
    tip.innerHTML = d + '<br>영업이익 ' + fmtOp(v) + dchg;
    tip.style.display = 'block';
    const px = X(d) / W * r.width;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = 'auto';
    tip.style.bottom = (B / H * r.height + 6) + 'px';   // X축 라벨 바로 위 (하단 고정)
  });
  svg.addEventListener('mouseleave', () => {
    tip.style.display = 'none'; cross.style.display = 'none'; dot.style.display = 'none';
  });
}


// ===== 이익 컨센서스 상향 ETF 랭킹 (첫 화면 위젯) =====
// 각 ETF의 Σ(영업이익 컨센서스 × 보유비중)이 10·20영업일 전 대비 얼마나 변했는지.
// 컨센서스가 있는 연도(현재 2026E·2027E)별로 각각 계산, 두 날짜 모두 값이 있는 종목만 짝지어 비교.
async function loadOpMomentum(date) {
  const rows = [];
  for (const mo of monthsList(date, 3)) rows.push(...await readMonth('e', mo));
  const byFy = new Map();   // fy -> Map(종목명 -> Map(date -> op))
  for (const r of rows) {
    const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
    if (d > date) continue;
    const fy = Number(r.fy);
    let stocks = byFy.get(fy);
    if (!stocks) byFy.set(fy, stocks = new Map());
    let m = stocks.get(r.name);
    if (!m) stocks.set(r.name, m = new Map());
    m.set(d, r.op);
  }

  const result = [];
  for (const fy of Array.from(byFy.keys()).sort((a, b) => a - b)) {
    const stocks = byFy.get(fy);
    const dset = new Set();
    for (const m of stocks.values()) for (const d of m.keys()) dset.add(d);
    const ds = Array.from(dset).sort();
    if (ds.length < 11) continue;
    const d0 = ds[ds.length - 1];
    const d10 = ds[ds.length - 11];
    const d20 = ds.length >= 21 ? ds[ds.length - 21] : null;

    // ETF 상세의 '구성종목 영업이익 컨센서스 총합' 차트와 동일한 값(현재 구성·비중 고정,
    // 날짜별 컨센서스 총합)의 변화율 — 위젯 수치가 차트에서 보이는 움직임과 일치하도록.
    // 단, 비교 기간 중 컨센서스가 생기거나 사라진 종목(비중 합 1%p 초과)이 있는 ETF는
    // 총합 변화가 상향이 아닌 커버리지 변동을 반영하므로 랭킹에서 제외
    // (예: 대형 적자 컨센서스 소멸 시 총합이 급등해 보이는 착시)
    const agg = new Map();   // etfCode -> {cov, s0, s10, s20, mm10, mm20}
    for (const [name, m] of stocks) {
      const entries = DATA[name];
      if (!entries) continue;
      const v0 = m.get(d0), v10 = m.get(d10), v20 = d20 ? m.get(d20) : null;
      if (v0 == null && v10 == null && v20 == null) continue;
      for (const e of entries) {
        const w = e[2];
        if (w == null || w <= 0) continue;
        let a = agg.get(e[0]);
        if (!a) agg.set(e[0], a = { cov: 0, s0: 0, s10: 0, s20: 0, mm10: 0, mm20: 0 });
        if (v0 != null) { a.s0 += v0 * w; a.cov += w; }
        if (v10 != null) a.s10 += v10 * w;
        if (v20 != null) a.s20 += v20 * w;
        if ((v0 != null) !== (v10 != null)) a.mm10 += w;
        if (d20 && (v0 != null) !== (v20 != null)) a.mm20 += w;
      }
    }
    const rank = (kn, mm) => {
      const out = [];
      for (const [code, a] of agg) {
        if (a.cov < 20 || a[kn] <= 0 || a[mm] > 1) continue;   // 커버리지 20% 미만·변동 1%p 초과 제외
        if (LEV.test(ETFS_CUR[code] || '')) continue;
        const chg = a.s0 / a[kn] - 1;
        if (chg > 0.0005) out.push([code, chg, a.cov]);
      }
      out.sort((x, y) => y[1] - x[1]);
      return out.slice(0, 10);
    };
    result.push({ fy: fy, d0: d0, d10: d10, d20: d20,
                  top10: rank('s10', 'mm10'), top20: d20 ? rank('s20', 'mm20') : [] });
  }
  return result.length ? result : null;
}

// ===== ETF 구성종목 컨센서스 영업이익 총합 추이 =====
// 기준일 구성종목(이름 매칭)의 연간 영업이익 컨센서스를 날짜별로 보유비중 가중 합산 — 구성은 기준일로 고정
const ETF_CONS_CACHE = new Map();   // 'code|기준일' -> {fys:[fy], byFy:Map(fy -> [[date,합계,종목수]])}

async function loadEtfConsTotal(code) {
  const key = code + '|' + currentDate;
  if (ETF_CONS_CACHE.has(key)) return ETF_CONS_CACHE.get(key);
  const wByName = new Map();   // 종목명 -> 비중(0~1). 비중 없는 항목은 제외
  for (const [nm, w] of (HOLDINGS[code] || [])) if (w != null) wByName.set(nm, w / 100);
  // 컨센서스 추이 DB 시작(2024-12)부터 기준일까지의 월 파일
  const [y, m] = [parseInt(currentDate.slice(0, 4)), parseInt(currentDate.slice(5, 7))];
  const nMonths = Math.max(1, (y - 2024) * 12 + m - 11);
  const byFy = new Map();
  await Promise.all(monthsList(currentDate, nMonths).map(async mo => {
    for (const r of await readMonth('e', mo)) {
      const w = wByName.get(r.name);
      if (w == null) continue;
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d > currentDate) continue;
      const fy = Number(r.fy);
      let m2 = byFy.get(fy);
      if (!m2) byFy.set(fy, m2 = new Map());
      const acc = m2.get(d) || [0, 0];
      acc[0] += r.op * w; acc[1]++;
      m2.set(d, acc);
    }
  }));
  const out = new Map();
  for (const [fy, m2] of byFy) {
    const arr = Array.from(m2, ([d, a]) => [d, a[0], a[1]]).sort((a, b) => a[0] < b[0] ? -1 : 1);
    if (arr.length >= 2) out.set(fy, arr);
  }
  const res = { fys: Array.from(out.keys()).sort((a, b) => a - b), byFy: out };
  ETF_CONS_CACHE.set(key, res);
  return res;
}

function showEtfEarnCons(code, name) {
  const tok = chartToken;
  earnArea.style.display = '';
  earnArea.innerHTML = '<div class="chart-card"><div class="chart-title">&#128202; ' + escHtml(name) +

    '<div class="chart-loading">구성종목 컨센서스를 불러오는 중&hellip;</div></div>';
  loadEtfConsTotal(code).then(res => {
    if (tok !== chartToken) return;
    if (!currentView || currentView.type !== 'etf' || currentView.code !== code) return;

      earnArea.style.display = 'none';
      earnArea.innerHTML = '';
      return;
    }
    renderEtfConsChart(code, name, res);
  });
}

const CONS_COLORS = ['#3f51b5', '#00897b', '#e65100'];

function renderEtfConsChart(code, name, res) {
  const fys = res.fys;
  const W = Math.max(320, earnArea.clientWidth - 40), H = 210;
  const L = 66, R = 14, T = 30, B = 30;
  // 전체 기간·값 범위 (모든 연도 라인 공통 축)
  let x0 = Infinity, x1 = -Infinity, vmin = Infinity, vmax = -Infinity;
  for (const fy of fys) for (const [d, v] of res.byFy.get(fy)) {
    const t = Date.parse(d);
    if (t < x0) x0 = t; if (t > x1) x1 = t;
    if (v < vmin) vmin = v; if (v > vmax) vmax = v;
  }
  const pad = (vmax - vmin) * 0.1 || Math.abs(vmax) * 0.05 || 1;
  vmin -= pad; vmax += pad;
  const X = d => L + (Date.parse(d) - x0) / Math.max(x1 - x0, 1) * (W - L - R);
  const Y = v => T + (vmax - v) / (vmax - vmin) * (H - T - B);

  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = vmin + (vmax - vmin) * i / 3, yy = Y(v).toFixed(1);
    g += '<line x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '" stroke="#eee"/>' +
      '<text x="' + (L - 8) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle" font-size="10" fill="#999">' + fmtOp(v) + '</text>';
  }
  // X축: 분기 간격 월 라벨 (YY.MM)
  const [ey, em] = [parseInt(currentDate.slice(0, 4)), parseInt(currentDate.slice(5, 7))];
  const nMonths = Math.max(1, (ey - 2024) * 12 + em - 11);
  monthsList(currentDate, nMonths).forEach((mo, i) => {
    if (i % 3 !== 1) return;
    const t = Date.parse(mo + '-01');
    if (t < x0 || t > x1) return;
    g += '<text x="' + X(mo + '-01').toFixed(1) + '" y="' + (H - 8) +
      '" text-anchor="middle" font-size="10" fill="#999">' + mo.slice(2).replace('-', '.') + '</text>';
  });
  // 연도별 라인 + 범례
  let lg = '', dots = '';
  fys.forEach((fy, i) => {
    const s = res.byFy.get(fy), c = CONS_COLORS[i % CONS_COLORS.length];
    g += '<path d="' + s.map((p, j) => (j ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('') +
      '" fill="none" stroke="' + c + '" stroke-width="1.8"/>';
    const last = s[s.length - 1];
    lg += '<tspan fill="' + c + '" font-weight="700">&#9644; ' + fy + 'E</tspan>' +
      '<tspan fill="#666"> ' + fmtOp(last[1]) + '  </tspan>';
    dots += '<circle id="ecsDot' + i + '" r="3" fill="' + c + '" style="display:none"/>';
  });
  g += '<text x="' + L + '" y="15" font-size="11.5">' + lg + '</text>';

  // 부가 정보: 커버리지 + 최신 시점 연도 간 증가율
  const lastArrs = fys.map(fy => res.byFy.get(fy)[res.byFy.get(fy).length - 1]);
  const cover = Math.max(...lastArrs.map(a => a[2]));
  let growth = '';
  if (fys.length >= 2) {
    const [a, b] = [lastArrs[0][1], lastArrs[lastArrs.length - 1][1]];
    const [gv, cls] = growthCell(b, a);
    growth = ' &middot; ' + fys[fys.length - 1] + 'E/' + fys[0] + 'E <span class="' + cls + '">' + gv + '</span>';
  }

  earnArea.innerHTML = '<div class="chart-card">' +
    '<div class="chart-title">&#128202; ' + escHtml(name) + ' &middot; 구성종목 영업이익 컨센서스 총합</div>' +
    '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '">' + g +
    '<line id="ecsCross" x1="0" y1="' + T + '" x2="0" y2="' + (H - B) + '" stroke="#bbb" stroke-dasharray="2 2" style="display:none"/>' +
    dots + '</svg><div class="chart-tip" id="ecsTip"></div></div>' +
    '<div class="chart-sub">기준일 구성 ' + (HOLDINGS[code] || []).length + '개 중 컨센서스 커버 ' + cover +
    '개 종목의 연간 영업이익 전망 &times; 보유비중(%) 가중 합산' + growth + ' &middot; 구성은 기준일 고정, 과거 커버리지 변동 포함</div></div>';
  earnArea.style.display = '';

  // 호버 툴팁: 가장 가까운 날짜의 연도별 총합 + 커버 종목 수
  const svg = earnArea.querySelector('svg');
  const tip = document.getElementById('ecsTip');
  const cross = document.getElementById('ecsCross');
  const allDates = Array.from(new Set([].concat(...fys.map(fy => res.byFy.get(fy).map(p => p[0]))))).sort();
  const byDate = fys.map(fy => new Map(res.byFy.get(fy).map(p => [p[0], p])));
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width * W;
    if (mx < L || mx > W - R) { tip.style.display = 'none'; cross.style.display = 'none';
      fys.forEach((f, i) => document.getElementById('ecsDot' + i).style.display = 'none'); return; }
    let bd = allDates[0];
    for (const d of allDates) if (Math.abs(X(d) - mx) < Math.abs(X(bd) - mx)) bd = d;
    cross.setAttribute('x1', X(bd)); cross.setAttribute('x2', X(bd)); cross.style.display = '';
    let html = bd;
    fys.forEach((fy, i) => {
      const p = byDate[i].get(bd);
      const dot = document.getElementById('ecsDot' + i);
      if (!p) { dot.style.display = 'none'; return; }
      dot.setAttribute('cx', X(bd)); dot.setAttribute('cy', Y(p[1])); dot.style.display = '';
      html += '<br><span style="color:' + CONS_COLORS[i % CONS_COLORS.length] + ';font-weight:700">' + fy + 'E</span> ' +
        fmtOp(p[1]) + ' <span style="opacity:.7">(' + p[2] + '종목)</span>';
    });
    tip.innerHTML = html;
    tip.style.display = 'block';
    const px = X(bd) / W * r.width;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = 'auto';
    tip.style.bottom = (B / H * r.height + 6) + 'px';
  });
  svg.addEventListener('mouseleave', () => {
    tip.style.display = 'none'; cross.style.display = 'none';
    fys.forEach((f, i) => { const d = document.getElementById('ecsDot' + i); if (d) d.style.display = 'none'; });
  });
}

function renderStockChart(name, s) {
  if (s.price.length < 2 && s.tp.length < 2) {
    chartArea.innerHTML = '<div class="chart-card"><div class="chart-title">&#128201; ' + escHtml(name) +
      ' &middot; 최근 1년</div><div class="chart-loading">가격 데이터가 없습니다' +
      (s.isEtf ? '' : ' (국내 상장 종목만 제공)') + '</div></div>';
    return;
  }
  // 오닐식 RS 등급(1~99) 추이 — 우측 고정축, 80 이상이 강세 기준
  const rs = (s.rs && s.rs.length > 1) ? s.rs : [];

  const W = Math.max(320, chartArea.clientWidth - 40);
  const H = 260, L = 62, R = rs.length ? 32 : 14, T = 16, B = 26;   // RS 축 자리를 우측에 확보
  const mainB = H - B;
  const xLabelY = H - 8;
  const x0 = Date.parse(s.from), x1 = Date.parse(currentDate);
  let vmin = Infinity, vmax = -Infinity;
  for (const [, v] of s.price) { if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
  for (const [, v] of s.tp) { if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
  const pad = (vmax - vmin) * 0.06 || vmax * 0.05;
  vmin -= pad; vmax += pad;
  const X = d => L + (Date.parse(d) - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (vmax - v) / (vmax - vmin) * (mainB - T);
  const path = (pts, yf) => pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + yf(p[1]).toFixed(1)).join('');
  const fmt = v => Math.round(v).toLocaleString();

  let g = '';
  for (let i = 0; i <= 4; i++) {           // 주가 패널 그리드 + Y 라벨
    const v = vmin + (vmax - vmin) * i / 4, y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="#eee"/>' +
      '<text x="' + (L - 8) + '" y="' + y + '" text-anchor="end" dominant-baseline="middle" font-size="11" fill="#999">' + fmt(v) + '</text>';
  }
  const mos = monthsList(currentDate, 13);  // X 라벨 (격월)
  for (let i = 1; i < mos.length; i += 2) {
    const t = Date.parse(mos[i] + '-01');
    if (t < x0 || t > x1) continue;
    const x = X(mos[i] + '-01').toFixed(1);
    g += '<text x="' + x + '" y="' + xLabelY + '" text-anchor="middle" font-size="11" fill="#999">' +
      mos[i].slice(2).replace('-', '.') + '</text>';
  }
  let lines = '';
  if (s.price.length > 1) lines += '<path d="' + path(s.price, Y) + '" fill="none" stroke="#3f51b5" stroke-width="1.8"/>';
  if (s.tp.length > 1) lines += '<path d="' + path(s.tp, Y) + '" fill="none" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 3"/>';

  // RS 등급 추이 — 우측 0~100 고정축(절대 등급), 80·50 기준선
  let rsAt = null, rsNow = null;
  if (rs.length) {
    const rsTop = T + 6, rsBot = mainB - 6;
    const YR = v => rsBot - v / 100 * (rsBot - rsTop);
    rsNow = rs[rs.length - 1][1];

    for (const u of [0, 50, 80, 100]) {
      const y = YR(u).toFixed(1);
      if (u === 50 || u === 80) {
        g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
          '" stroke="#2e7d32" stroke-opacity="' + (u === 80 ? 0.4 : 0.2) + '" stroke-dasharray="4 4"/>';
      }
      g += '<text x="' + (W - R + 5) + '" y="' + y + '" dominant-baseline="middle" font-size="10" fill="#2e7d32" opacity="' +
        (u === 80 ? '1' : '0.75') + '"' + (u === 80 ? ' font-weight="700"' : '') + '>' + u + '</text>';
    }
    // 등급선은 가격선 아래 레이어로(먼저 그림) — 가격이 주(主)
    lines = '<path d="' + path(rs, YR) + '" fill="none" stroke="#2e7d32" stroke-width="1.5" opacity="0.9"/>' +
      '<text x="' + (L + 4) + '" y="' + (YR(rs[0][1]) - 7).toFixed(1) +
      '" font-size="10" font-weight="700" fill="#2e7d32" opacity="0.9">RS</text>' + lines;
    rsAt = d => { let v = null; for (const p of rs) { if (p[0] <= d) v = p[1]; else break; } return v; };
  }

  const last = s.price.length ? s.price[s.price.length - 1][1] : null;
  const lastTp = s.tp.length ? s.tp[s.tp.length - 1][1] : null;
  const upside = (last && lastTp) ? ' &middot; 괴리율 ' + ((lastTp / last - 1) * 100).toFixed(1) + '%' : '';
  const legend = '<span style="color:#3f51b5">&#9644;</span> 수정주가' +
    (s.tp.length > 1 ? ' &nbsp;<span style="color:#c62828">&#9476;</span> 목표주가 컨센서스'
      : (s.isEtf ? '' : ' (목표주가 컨센서스 없음)')) +
    (rs.length ? ' &nbsp;<span style="color:#2e7d32">&#9644;</span> RS 등급 <b style="color:' +
      (rsNow >= 80 ? '#2e7d32' : rsNow >= 50 ? '#666' : '#c62828') + '">' + rsNow + '</b>' +
      '<span style="color:#bbb">/99 (우측축 · 일반 종목 대비)</span>' : '');

  chartArea.innerHTML = '<div class="chart-card">' +
    '<div class="chart-title">&#128201; ' + escHtml(name) + ' &middot; 최근 1년</div>' +
    '<div class="chart-sub">' + legend + upside + '</div>' +
    '<div class="chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '">' + g + lines +
    '<line id="chartCross" x1="0" y1="' + T + '" x2="0" y2="' + mainB + '" stroke="#bbb" stroke-dasharray="2 2" style="display:none"/>' +
    '</svg><div class="chart-tip" id="chartTip"></div></div></div>';

  // 호버 툴팁: 가장 가까운 거래일의 수정주가·목표주가 표시
  const wrap = chartArea.querySelector('.chart-wrap');
  const svg = wrap.querySelector('svg');
  const tip = document.getElementById('chartTip');
  const cross = document.getElementById('chartCross');
  const at = (arr, d) => {                 // d 이하 가장 최근 값
    let v = null;
    for (const p of arr) { if (p[0] <= d) v = p[1]; else break; }
    return v;
  };
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width * W;
    if (mx < L || mx > W - R || !s.price.length) { tip.style.display = 'none'; cross.style.display = 'none'; return; }
    let best = s.price[0];
    for (const p of s.price) if (Math.abs(X(p[0]) - mx) < Math.abs(X(best[0]) - mx)) best = p;
    const d = best[0], tpv = at(s.tp, d);
    const rsv = rsAt ? rsAt(d) : null;
    cross.setAttribute('x1', X(d)); cross.setAttribute('x2', X(d)); cross.style.display = '';
    tip.innerHTML = d + '<br>수정주가 ' + fmt(best[1]) + '원' + (tpv ? '<br>목표주가 ' + fmt(tpv) + '원' : '') +
      (rsv != null ? '<br>RS 등급 ' + rsv + ' <span style="opacity:.7">/99</span>' : '');
    tip.style.display = 'block';
    const px = X(d) / W * r.width;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = 'auto';
    tip.style.bottom = (B / H * r.height + 6) + 'px';   // X축 라벨 바로 위 (하단 고정)
  });
  svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.style.display = 'none'; });
}

// ===== RS 등급 급등 (db/market/rs) =====
// 20영업일 전 대비 RS 등급 상승폭 랭킹 (검색 가능한 일반 종목만)
async function loadRsMovers(date) {
  const dateSet = new Set();
  const byDate = new Map();   // dateStr -> Map(name -> rs)
  await Promise.all(monthsList(date, 3).map(async mo => {
    for (const r of await readMonth('r', mo)) {
      const d = (r.date instanceof Date) ? r.date.toISOString().slice(0, 10) : String(r.date).slice(0, 10);
      if (d > date) continue;
      dateSet.add(d);
      let m = byDate.get(d);
      if (!m) byDate.set(d, m = new Map());
      m.set(r.name, r.rs);
    }
  }));
  const ds = Array.from(dateSet).sort();
  if (ds.length < 21) return null;
  const d0 = ds[ds.length - 1], d20 = ds[ds.length - 21];
  const m0 = byDate.get(d0), m20 = byDate.get(d20);
  const arr = [];
  for (const [nm, r0] of m0) {
    if (!DATA[nm]) continue;             // ETF·미보유 종목 제외
    const r1 = m20.get(nm);
    if (r1 == null || r0 <= r1) continue;
    arr.push([nm, r0 - r1, r0]);
  }
  arr.sort((a, b) => (b[1] - a[1]) || (b[2] - a[2]));
  return { d0: d0, d20: d20, top: arr.slice(0, 10) };
}

  for (const name in DATA) {

    let s = 0, n = 0;
    for (const e of DATA[name]) if (e[2] != null && !LEV.test(e[1])) { s += e[2]; n++; }

  html += '</div>';

async function loadDateData(date) {
  currentDate = date;
  currentView = null;
  selectedStocks = [];
  backBtnArea.style.display = 'none';
  tagsArea.style.display = 'none';
  hideStockChart();

  introArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>' + date + ' 데이터를 불러오는 중...</p></div>';
  introArea.style.display = '';
  resultArea.style.display = 'none';
  statsArea.style.display = 'none';
  breadcrumb.style.display = 'none';
  searchInput.value = '';
  searchInput.disabled = true;

  try {
    // 현재 날짜 + 비교 날짜(1·5·10 영업일 전)를 병렬 로드
    const idx = DATES.indexOf(date);
    const offs = [1, 5, 10].filter(o => idx - o >= 0);
    const [cur, ...comps] = await Promise.all(
      [date, ...offs.map(o => DATES[idx - o])].map(fetchDateMap));

    COMPS = {};
    offs.forEach((o, i) => {
      const h = comps[i].holdings;
      const w = new Map(), codes = new Set();
      for (const code in h) {
        codes.add(code);
        for (let j = 0; j < h[code].length; j++) w.set(code + '|' + h[code][j][0], h[code][j][1]);
      }
      COMPS[o] = { date: DATES[idx - o], w: w, codes: codes };
    });

    HOLDINGS = cur.holdings;
    const ETFS = cur.etfs;
    ETFS_CUR = ETFS;
    // holdings(ETF→종목)를 뒤집어 data(종목→ETF)와 names를 즉석 생성
    DATA = {};
    const nameSet = new Set();
    for (const code in HOLDINGS) {
      const etfName = ETFS[code] || code;
      const items = HOLDINGS[code];
      for (let i = 0; i < items.length; i++) {
        const comp = items[i][0], w = items[i][1];
        (DATA[comp] || (DATA[comp] = [])).push([code, etfName, w]);
        nameSet.add(comp);
      }
    }
    NAMES = Array.from(nameSet).sort();

    dateInfo.textContent = NAMES.length.toLocaleString() + '개 종목 / ' + Object.keys(HOLDINGS).length.toLocaleString() + '개 ETF';

    searchInput.disabled = false;
    searchInput.placeholder = '종목명을 입력하세요 (예: 삼성전자, NVIDIA, SK하이닉스)';
    searchInput.focus();

    renderIntro();

    // 수익률·목표주가 모멘텀 랭킹은 가격·컨센서스 파일 로드 후 비동기로 채움 (검색 사용을 막지 않음)
    RET = null;
    TPM = null;
    const reqDate = date;
    loadPrices(date, ETFS).then(ret => {
      if (currentDate !== reqDate) return;   // 로드 중 날짜가 바뀐 경우 무시
      RET = ret || { d0: null, d1: null, d5: null, d20: null, top1: [], top5: [], top20: [] };
      if (introArea.style.display !== 'none') renderIntro();
    });
    loadConsensus(date).then(t => {
      if (currentDate !== reqDate) return;
      TPM = t || { d0: null, d20: null, up: [], down: [], stockUp: [], stockDown: [] };
      if (introArea.style.display !== 'none') renderIntro();
    });
    OPM = null;
    loadOpMomentum(date).then(t => {
      if (currentDate !== reqDate) return;
      OPM = t || [];
      if (introArea.style.display !== 'none') renderIntro();
    });
    RSM = null;
    loadRsMovers(date).then(t => {
      if (currentDate !== reqDate) return;
      RSM = t || { d0: null, d20: null, top: [] };
      if (introArea.style.display !== 'none') renderIntro();
    });
  } catch (err) {
    introArea.innerHTML = '<div class="intro"><div class="emoji">&#9888;&#65039;</div>' +
      '<p>' + date + ' 데이터를 불러올 수 없습니다.</p></div>';
  }
}

dateSelect.addEventListener('change', function() {
  loadDateData(this.value).then(() => syncUrl());
});

// ===== UTILS =====
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightMatch(text, query) {
  if (!query) return escHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escHtml(text);
  return escHtml(text.substring(0, idx)) +
    '<span class="highlight">' + escHtml(text.substring(idx, idx + query.length)) + '</span>' +
    escHtml(text.substring(idx + query.length));
}

function safeAttr(s) {
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

// ===== STOCK SEARCH VIEW =====
function showStockResults(name) {
  const entries = DATA[name];
  if (!entries) {
    hideStockChart();
    introArea.innerHTML = '<div class="intro"><p>검색 결과가 없습니다.</p></div>';
    introArea.style.display = '';
    resultArea.style.display = 'none';
    statsArea.style.display = 'none';
    breadcrumb.style.display = 'none';
    return;
  }

  currentView = { type: 'stock', name: name };

  // 비중 + N영업일 전 대비 변화(%p) 계산
  const rows = entries.map(e => ({
    code: e[0] || '-', name: e[1], w: e[2],
    d1: deltaFor(e[0], name, e[2], 1),
    d5: deltaFor(e[0], name, e[2], 5),
    d10: deltaFor(e[0], name, e[2], 10)
  }));
  const key = stockSort;
  // 선택 방향으로 정렬하되 값 없는 행은 항상 뒤로
  rows.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return stockSortDir < 0 ? bv - av : av - bv;
  });
  const maxWeight = rows.reduce((m, r) => Math.max(m, r.w || 0), 0);

  // 합계 (표시 중인 전체 ETF 기준)
  const sum = { w: 0, d1: null, d5: null, d10: null };
  rows.forEach(r => {
    if (r.w != null) sum.w += r.w;
    for (const k of ['d1', 'd5', 'd10'])
      if (r[k] != null) sum[k] = (sum[k] || 0) + r[k];
  });

  breadcrumb.innerHTML = '<span class="current">&#128200; ' + escHtml(name) + ' 보유 ETF</span>';
  breadcrumb.style.display = 'flex';

  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">검색 종목</div><div class="value small">' + escHtml(name) + '</div></div>' +
    '<div class="stat-card"><div class="label">보유 ETF 수</div><div class="value">' + rows.length.toLocaleString() + '</div></div>' +
    '<div class="stat-card"><div class="label">최대 비중</div><div class="value">' + (maxWeight ? maxWeight.toFixed(2) + '%' : '-') + '</div></div>';
  statsArea.style.display = 'flex';

  const sortTh = (k, label, tip) => '<th class="th-sort' + (stockSort === k ? ' on' : '') +
    '" style="text-align:right" title="' + tip + ' (재클릭 시 방향 전환)" onclick="setStockSort(\'' + k + '\')">' +
    label + (stockSort === k ? (stockSortDir < 0 ? ' &#9660;' : ' &#9650;') : '') + '</th>';
  thead.innerHTML = '<tr><th style="width:50px">#</th><th>ETF 종목명</th>' +
    sortTh('w', '비중(%)', '현재 비중 기준 정렬') +
    sortTh('d1', '&Delta;1일', (COMPS[1] ? COMPS[1].date + ' 대비 변화(%p)' : '비교 데이터 없음')) +
    sortTh('d5', '&Delta;5일', (COMPS[5] ? COMPS[5].date + ' 대비 변화(%p)' : '비교 데이터 없음')) +
    sortTh('d10', '&Delta;10일', (COMPS[10] ? COMPS[10].date + ' 대비 변화(%p)' : '비교 데이터 없음')) + '</tr>';

  const dcell = d => d == null ? '<td class="dcell">-</td>' :
    '<td class="dcell ' + (d > 0.005 ? 'd-up' : d < -0.005 ? 'd-down' : 'd-flat') + '">' +
    (d >= 0 ? '+' : '') + d.toFixed(2) + '</td>';

  // 합계 행 (정렬과 무관하게 항상 맨 위)
  let html = '<tr class="sum-row"><td class="rank">&Sigma;</td>' +
    '<td>합계 <span class="code-sub">' + rows.length + '개 ETF</span></td>' +
    '<td class="weight">' + sum.w.toFixed(2) + '%</td>' +
    dcell(sum.d1) + dcell(sum.d5) + dcell(sum.d10) + '</tr>';
  rows.forEach((r, i) => {
    const barWidth = maxWeight > 0 && r.w ? (r.w / maxWeight * 60) : 0;
    html += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
      '<td class="rank">' + (i + 1) + '</td>' +
      '<td class="etf-link">' + escHtml(r.name) + '<div class="code-sub">' + escHtml(r.code) + '</div></td>' +
      '<td class="weight">' +
        (r.w != null ? '<span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.w.toFixed(2) + '%' : '-') +
      '</td>' + dcell(r.d1) + dcell(r.d5) + dcell(r.d10) + '</tr>';
  });
  tbody.innerHTML = html;

  const sortLabel = { w: '비중(%)', d1: '1일 비중변화(%p)', d5: '5일 비중변화(%p)', d10: '10일 비중변화(%p)' };
  document.getElementById('resultTitle').textContent = '"' + name + '" 보유 ETF (' + rows.length + '개)';
  document.getElementById('sortInfo').textContent = sortLabel[stockSort] + ' 기준 ' +
    (stockSortDir < 0 ? '내림차순' : '오름차순') + ' · 저장된 영업일 기준';
  introArea.style.display = 'none';
  resultArea.style.display = '';
  showStockChart(name);
  syncUrl();
}

function setStockSort(k) {
  if (stockSort === k) stockSortDir = -stockSortDir;   // 같은 컬럼 재클릭 -> 방향 전환
  else { stockSort = k; stockSortDir = -1; }
  if (currentView && currentView.type === 'stock') {
    showStockResults(currentView.name);  // 같은 화면 재렌더 — 주소 동일이라 히스토리 추가 없음
  }
}

// ===== ETF HOLDINGS VIEW =====
function showEtfHoldings(etfCode, etfName) {
  const items = HOLDINGS[etfCode];
  if (!items || items.length === 0) {
    alert('해당 ETF의 보유내역 정보가 없습니다.');
    return;
  }

  const fromStock = currentView && currentView.type === 'stock' ? currentView.name : null;
  currentView = { type: 'etf', code: etfCode, name: etfName, fromStock: fromStock };
  showEtfChart(etfCode, etfName);
  showEtfEarnCons(etfCode, etfName);

  items.sort((a, b) => (b[1] || 0) - (a[1] || 0));
  const maxWeight = items.reduce((m, e) => Math.max(m, e[1] || 0), 0);

  let bc = '';
  if (fromStock) {
    bc += '<a onclick="showStockResults(\'' + safeAttr(fromStock) + '\')">' + escHtml(fromStock) + '</a>';
    bc += '<span class="sep">&#9654;</span>';
  }
  bc += '<span class="current">&#128188; ' + escHtml(etfName) + '</span>';
  breadcrumb.innerHTML = bc;
  breadcrumb.style.display = 'flex';

  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">ETF명</div><div class="value small">' + escHtml(etfName) + '</div></div>' +
    '<div class="stat-card"><div class="label">ETF 코드</div><div class="value small">' + escHtml(etfCode) + '</div></div>' +
    '<div class="stat-card"><div class="label">보유 종목 수</div><div class="value">' + items.length + '</div></div>';
  statsArea.style.display = 'flex';

  thead.innerHTML = '<tr><th style="width:50px">#</th><th>보유 종목명</th><th style="text-align:right;min-width:120px">비중(%)</th></tr>';

  let html = '';
  items.forEach((e, i) => {
    const compName = e[0];
    const weight = e[1];
    const barWidth = maxWeight > 0 && weight ? (weight / maxWeight * 80) : 0;
    const isHighlighted = fromStock && compName === fromStock;
    const rowClass = isHighlighted ? 'highlighted clickable' : 'clickable';
    html += '<tr class="' + rowClass + '" onclick="searchComponent(\'' + safeAttr(compName) + '\')">' +
      '<td class="rank">' + (i + 1) + '</td>' +
      '<td class="etf-link">' + escHtml(compName) + (isHighlighted ? ' &#11088;' : '') + '</td>' +
      '<td class="weight">' +
        (weight != null ? '<span class="weight-bar green" style="width:' + barWidth + 'px"></span>' + weight.toFixed(2) + '%' : '-') +
      '</td></tr>';
  });
  tbody.innerHTML = html;

  document.getElementById('resultTitle').textContent = escHtml(etfName) + ' 보유내역 (' + items.length + '개 종목)';
  document.getElementById('sortInfo').textContent = '비중(%) 기준 내림차순 정렬';
  introArea.style.display = 'none';
  resultArea.style.display = '';
  syncUrl();
}

function searchComponent(name) {
  selectedStocks = [name];
  searchInput.value = '';
  renderTags();
  showStockResults(name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== MULTI-STOCK TAG MANAGEMENT =====
function addStock(name) {
  if (selectedStocks.includes(name)) return;
  selectedStocks.push(name);
  searchInput.value = '';
  renderTags();
  triggerSearch();
}

function removeStock(name) {
  selectedStocks = selectedStocks.filter(s => s !== name);
  renderTags();
  if (selectedStocks.length === 0) {
    currentView = null;
    hideStockChart();
    renderIntro();
    introArea.style.display = '';
    resultArea.style.display = 'none';
    statsArea.style.display = 'none';
    breadcrumb.style.display = 'none';
    backBtnArea.style.display = 'none';
    syncUrl();
  } else {
    triggerSearch();
  }
}

function clearAllStocks() {
  selectedStocks = [];
  currentView = null;
  renderTags();
  hideStockChart();
  renderIntro();
  introArea.style.display = '';
  resultArea.style.display = 'none';
  statsArea.style.display = 'none';
  breadcrumb.style.display = 'none';
  backBtnArea.style.display = 'none';
  syncUrl();
}

function renderTags() {
  if (selectedStocks.length === 0) {
    tagsArea.style.display = 'none';
    return;
  }
  let html = selectedStocks.map(s =>
    '<span class="tag">' + escHtml(s) + ' <span class="remove" onclick="removeStock(\'' + safeAttr(s) + '\')">&times;</span></span>'
  ).join('');
  if (selectedStocks.length > 1) {
    html += '<button class="clear-btn" onclick="clearAllStocks()">전체 삭제</button>';
  }
  tagsArea.innerHTML = html;
  tagsArea.style.display = 'flex';
}

function triggerSearch() {
  currentView = null;
  if (selectedStocks.length === 1) {
    showStockResults(selectedStocks[0]);
  } else if (selectedStocks.length >= 2) {
    showMultiStockResults();
  }
}

// ===== MULTI-STOCK COMBINED VIEW =====
function showMultiStockResults() {
  // Find ETFs that hold ALL selected stocks, sum their weights
  const etfWeights = {}; // etfCode -> {name, weights: {stock: weight}, total}

  selectedStocks.forEach(stockName => {
    const entries = DATA[stockName];
    if (!entries) return;
    entries.forEach(e => {
      const code = e[0];
      const etfName = e[1];
      const weight = e[2] || 0;
      if (!etfWeights[code]) {
        etfWeights[code] = { name: etfName, weights: {}, total: 0, count: 0 };
      }
      etfWeights[code].weights[stockName] = weight;
      etfWeights[code].total += weight;
      etfWeights[code].count++;
    });
  });

  // Filter: only ETFs that hold at least 1 selected stock, sort by total weight desc
  const results = Object.entries(etfWeights)
    .map(([code, info]) => ({ code, ...info }))
    .sort((a, b) => b.total - a.total);

  // Separate: ETFs with ALL stocks vs partial
  const allMatch = results.filter(r => r.count === selectedStocks.length);
  const partialMatch = results.filter(r => r.count < selectedStocks.length);

  currentView = { type: 'multi', names: [...selectedStocks] };
  hideStockChart();

  const stockLabel = selectedStocks.join(' + ');
  const maxWeight = results.length > 0 ? results[0].total : 0;
  // 최대 합산 비중은 "모두 보유한" ETF 기준 (단일종목 레버리지 등 일부 보유 ETF 제외)
  const maxAllWeight = allMatch.length > 0 ? allMatch[0].total : 0;

  // Breadcrumb
  breadcrumb.innerHTML = '<span class="current">&#128200; ' + escHtml(stockLabel) + ' 합산 비중</span>';
  breadcrumb.style.display = 'flex';

  // Stats
  statsArea.innerHTML =
    '<div class="stat-card"><div class="label">검색 종목</div><div class="value small">' + escHtml(stockLabel) + '</div></div>' +
    '<div class="stat-card"><div class="label">모두 보유 ETF</div><div class="value">' + allMatch.length + '</div></div>' +
    '<div class="stat-card"><div class="label">최대 합산 비중 (모두 보유)</div><div class="value">' + (maxAllWeight ? maxAllWeight.toFixed(2) + '%' : '-') + '</div></div>';
  statsArea.style.display = 'flex';

  // Table header: 합산 먼저, 개별 종목은 뒤에
  let thHtml = '<tr><th style="width:50px">#</th><th>ETF 종목명</th><th>ETF 코드</th>';
  thHtml += '<th style="text-align:right;min-width:100px">합산(%)</th>';
  selectedStocks.forEach(s => {
    thHtml += '<th style="text-align:right;min-width:80px">' + escHtml(s) + '</th>';
  });
  thHtml += '</tr>';
  thead.innerHTML = thHtml;

  // Table body: 합산 컬럼을 ETF코드 바로 다음에 배치
  function renderRows(list) {
    let html = '';
    list.forEach((r, i) => {
      const barWidth = maxWeight > 0 ? (r.total / maxWeight * 80) : 0;
      html += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
        '<td class="rank">' + (i + 1) + '</td>' +
        '<td class="etf-link">' + escHtml(r.name) + '</td>' +
        '<td class="code">' + escHtml(r.code) + '</td>' +
        '<td class="weight"><span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.total.toFixed(2) + '%</td>';
      selectedStocks.forEach(s => {
        const w = r.weights[s];
        html += '<td class="weight">' + (w != null ? w.toFixed(2) + '%' : '-') + '</td>';
      });
      html += '</tr>';
    });
    return html;
  }

  let bodyHtml = '';
  if (allMatch.length > 0) {
    bodyHtml += renderRows(allMatch);
  }
  if (partialMatch.length > 0 && allMatch.length > 0) {
    bodyHtml += '<tr><td colspan="' + (4 + selectedStocks.length) + '" style="padding:12px 16px;background:#f5f5f5;color:#888;font-size:13px;font-weight:600;">&#9660; 일부만 보유한 ETF (' + partialMatch.length + '개)</td></tr>';
  }
  if (partialMatch.length > 0) {
    let partialHtml = '';
    partialMatch.forEach((r, i) => {
      const barWidth = maxWeight > 0 ? (r.total / maxWeight * 80) : 0;
      partialHtml += '<tr class="clickable" onclick="showEtfHoldings(\'' + safeAttr(r.code) + '\',\'' + safeAttr(r.name) + '\')">' +
        '<td class="rank" style="color:#999">' + (i + 1) + '</td>' +
        '<td class="etf-link">' + escHtml(r.name) + '</td>' +
        '<td class="code">' + escHtml(r.code) + '</td>' +
        '<td class="weight"><span class="weight-bar" style="width:' + barWidth + 'px"></span>' + r.total.toFixed(2) + '%</td>';
      selectedStocks.forEach(s => {
        const w = r.weights[s];
        partialHtml += '<td class="weight">' + (w != null ? w.toFixed(2) + '%' : '-') + '</td>';
      });
      partialHtml += '</tr>';
    });
    bodyHtml += partialHtml;
  }

  tbody.innerHTML = bodyHtml;

  document.getElementById('resultTitle').textContent = stockLabel + ' 합산 비중 (' + results.length + '개 ETF)';
  document.getElementById('sortInfo').textContent = '합산 비중(%) 기준 내림차순 정렬';
  introArea.style.display = 'none';
  resultArea.style.display = '';
  syncUrl();
}

function goBack() {
  // 브라우저 히스토리가 단일 소스 — popstate 핸들러(applyStateFromUrl)가 이전 화면을 복원
  history.back();
}

// ===== AUTOCOMPLETE =====
function updateAutocomplete() {
  const q = searchInput.value.trim();
  if (q.length === 0) { autocompleteEl.style.display = 'none'; acFiltered = []; acIndex = -1; return; }
  const ql = q.toLowerCase();
  // 정확 일치 > 접두 일치 > 포함 순으로 정렬
  const score = n => { const nl = n.toLowerCase(); return nl === ql ? 0 : nl.startsWith(ql) ? 1 : 2; };
  acFiltered = NAMES.filter(n => n.toLowerCase().includes(ql))
    .sort((a, b) => score(a) - score(b) || (a < b ? -1 : 1)).slice(0, 50);
  acIndex = -1;
  if (acFiltered.length === 0) { autocompleteEl.style.display = 'none'; return; }
  autocompleteEl.innerHTML = acFiltered.map((n, i) =>
    '<div class="item" data-idx="' + i + '">' + highlightMatch(n, q) + '</div>'
  ).join('');
  autocompleteEl.style.display = 'block';
  autocompleteEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('mousedown', function(e) {
      e.preventDefault();
      selectItem(parseInt(this.dataset.idx));
    });
  });
}

function selectItem(idx) {
  if (idx < 0 || idx >= acFiltered.length) return;
  const name = acFiltered[idx];
  autocompleteEl.style.display = 'none';
  addStock(name);
}

function highlightItem(idx) {
  const items = autocompleteEl.querySelectorAll('.item');
  items.forEach(el => el.classList.remove('active'));
  if (idx >= 0 && idx < items.length) {
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  }
}

searchInput.addEventListener('input', updateAutocomplete);
searchInput.addEventListener('keydown', function(e) {
  if (autocompleteEl.style.display === 'none' || acFiltered.length === 0) {
    if (e.key === 'Enter') {
      const q = searchInput.value.trim();
      if (DATA[q]) { addStock(q); }
      else {
        const match = NAMES.find(n => n.toLowerCase() === q.toLowerCase());
        if (match) { addStock(match); }
      }
    }
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, acFiltered.length - 1); highlightItem(acIndex); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightItem(acIndex); }
  else if (e.key === 'Enter') { e.preventDefault(); if (acIndex >= 0) selectItem(acIndex); else if (acFiltered.length > 0) selectItem(0); }
  else if (e.key === 'Escape') { autocompleteEl.style.display = 'none'; }
});
searchInput.addEventListener('blur', function() { setTimeout(() => { autocompleteEl.style.display = 'none'; }, 150); });
searchInput.addEventListener('focus', function() { if (searchInput.value.trim().length > 0) updateAutocomplete(); });

// ===== START =====
init();

// PWA 서비스워커 등록 (사이트 전체 워커, 오프라인 캐시 + 홈 화면 설치)
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
